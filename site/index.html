<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Republik Netizenia — Kota Radial, Sungai & PLN</title>
<meta name="description" content="Kota claymation yang dihuni rakyat dari Instagram. Follow = jadi rakyat. Komen = usulan.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;700&display=swap">
<style>
:root{--bg:#FFF1D0;--card:#FFFAEC;--text:#20301F;--brand:#1F4D36;--onb:#FFF4DA;--gold:#F0B52E;--ongold:#2B2100;--shd:rgba(31,77,54,.3);--line:#E6D3A3;--ok:#2E7D32;--warn:#E65100;--bad:#B3261E;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12231A;--card:#1B3326;--text:#FFF1D0;--brand:#F0B52E;--onb:#2B2100;--shd:rgba(0,0,0,.5);--line:#2D4A3A;--ok:#81C784;--warn:#FFB74D;--bad:#FFB4A9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12231A;--card:#1B3326;--text:#FFF1D0;--brand:#F0B52E;--onb:#2B2100;--shd:rgba(0,0,0,.5);--line:#2D4A3A;--ok:#81C784;--warn:#FFB74D;--bad:#FFB4A9;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8FCB7A;color:var(--text);font:600 15px/1.4 Nunito,system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
.top{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none;display:grid;gap:6px;z-index:3;transition:opacity .25s}
.top>*{pointer-events:auto}
.bar{display:flex;align-items:stretch;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{background:var(--card);border-radius:18px;padding:7px 12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 var(--shd);border:1px solid var(--line)}
h1{font:700 1.08rem/1 Fredoka,sans-serif;color:var(--brand);margin:0;display:flex;align-items:center;gap:6px}
small{font-size:.75rem;opacity:.88}
.ig{font:700 .8rem Fredoka,sans-serif;text-decoration:none;color:var(--text);display:flex;align-items:center;gap:5px}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chips .pill{flex-shrink:0}
.chips .pill{font-size:.77rem;padding:4px 10px;border-radius:14px;cursor:pointer;border:1px solid var(--line);font:700 .77rem Nunito,sans-serif;color:var(--text)}
.chips .pill:active{transform:translateY(2px)}
#banner{background:var(--gold);color:var(--ongold);font:700 .74rem Nunito,sans-serif;padding:4px 10px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 3px 0 var(--shd)}
#feed{position:fixed;left:12px;bottom:calc(132px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;max-width:min(72vw,320px);z-index:6;pointer-events:none;transition:opacity .25s}
body:not(.notif-open) #feed{display:none}
#leftMenu{position:fixed;left:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;gap:8px}
#leftMenu button{width:auto;height:48px;border-radius:999px;border:2px solid rgba(255,255,255,.35);font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.4);position:relative;padding:0 14px;display:flex;align-items:center;gap:6px}
#leftChatBtn{background:#C8553D;color:#fff}
#leftNotifBtn{background:#2E7D6B;color:#fff}
#leftMenu .mbadge{position:absolute;top:-4px;right:-4px;background:#F0B52E;color:#1A1A1A;font:700 .68rem Nunito,sans-serif;border-radius:999px;padding:1px 6px;display:none}
#leftMenu .mbadge.show{display:inline-block}
body:not(.chat-open) #liveChatBox{display:none}
#feed span{background:rgba(18,28,18,.80);border-radius:12px;padding:7px 12px;font-size:.82rem;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);color:#FFFFFF;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:6;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;max-width:760px;margin:0 auto;transition:transform .25s, opacity .25s}
.dock::-webkit-scrollbar{display:none}
.dock .btn{flex-shrink:0}
#fab{position:fixed;right:12px;bottom:76px;z-index:6;display:flex;flex-direction:column;gap:6px}
@media(max-width:767px){#fab{bottom:calc(170px + env(safe-area-inset-bottom,0px));gap:8px}#fab .btn{min-width:48px;width:48px;height:48px;min-height:48px;padding:0}}
#fab .btn{min-width:44px;width:44px;padding:0}
body.photo-mode #fab{opacity:0;pointer-events:none}
@media(max-width:767px){body.livechat-focus .dock{display:none}#liveChatBox{width:min(86vw,320px)}}
#liveChatBox{position:fixed;left:12px;bottom:calc(132px + env(safe-area-inset-bottom,0px));width:min(86vw,320px);z-index:6;background:rgba(18,28,18,.94);color:#FFFFFF;backdrop-filter:none;border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:8px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
#liveChatStream{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:90px;max-height:160px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 28%);mask-image:linear-gradient(to bottom,transparent 0%,black 28%)}
.live-msg{font-size:.88rem;line-height:1.45;font-weight:600;color:#FFFFFF;animation:liveUp .25s ease}
.live-msg b{color:#FFFFFF}
#liveChatBox b{color:#FFFFFF}
#liveChatBox input{background:#FFFFFF;color:#1A1A1A}
.live-msg.sys{opacity:1;font-style:italic;color:#E0E0E0}
@keyframes liveUp{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
body.livechat-hidden #liveChatStream,body.livechat-hidden #liveChatInputRow,body.livechat-hidden #liveChatBox #feed,body.livechat-hidden #notifHeading{display:none}
#liveChatBox{max-height:min(62vh,430px);overflow-y:auto}
#liveChatBox #feed{position:static;max-width:none;width:100%;pointer-events:auto;margin-bottom:10px}
#liveChatBox #feed span{display:block}
#liveChatMenuBadge{display:none;background:#F0B52E;color:#1A1A1A;font:700 .72rem Nunito,sans-serif;border-radius:999px;padding:1px 7px;margin-left:6px}
body.livechat-hidden #liveChatMenuBadge{display:inline-block}
#liveChatBoxHeader{cursor:pointer}
body.photo-mode #liveChatBox{opacity:0;pointer-events:none}
body.dock-hidden .dock{transform:translateX(-120%);pointer-events:none}
#dockTab{position:fixed;left:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:7;border-radius:0 14px 14px 0}
body.text-hidden #dockTab,body.photo-mode #dockTab{display:none}
body.donor-hidden #donorBar{display:none}
#chatToast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(190px + env(safe-area-inset-bottom,0px));z-index:7;background:rgba(18,28,18,.94);color:#FFFFFF;border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:8px 14px;font-size:.88rem;font-weight:700;box-shadow:0 3px 8px rgba(0,0,0,.4);max-width:88vw;pointer-events:none;opacity:0;transition:opacity .3s;text-align:center}
#chatToast.show{opacity:1}
.chat-item{text-align:left;border:1px solid rgba(255,255,255,.25);border-radius:14px;background:#1E2E1E;color:#FFFFFF;padding:9px 12px;font:700 .9rem Nunito,sans-serif}
.btn{font:700 .9rem Fredoka,sans-serif;border:0;border-radius:999px;min-height:46px;padding:0 14px;background:var(--brand);color:var(--onb);cursor:pointer;box-shadow:inset 0 3px 0 rgba(255,255,255,.3),inset 0 -4px 0 rgba(0,0,0,.18),0 5px 0 var(--shd);display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.btn:active{transform:translateY(3px)}
.btn.gold{background:var(--gold);color:var(--ongold)}
.btn.soft{background:var(--card);color:var(--text);min-width:44px;padding:0 11px;border:1px solid var(--line)}
.dock .gold{flex:1}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#sheet{position:fixed;left:0;right:0;top:145px;bottom:12px;max-height:calc(100vh - 157px);overflow:auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--card) !important;border:2px solid var(--line);border-radius:26px 26px 0 0;padding:18px 16px calc(86px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s;box-shadow:0 -6px 0 var(--shd);z-index:50;max-width:680px;margin:0 auto;}
#sheet *{overflow-wrap:break-word;min-width:0}
#sheet.open{z-index:50}
body.sheet-open .top{z-index:60}
body.sheet-open #fab,body.sheet-open #leftMenu,body.sheet-open #liveChatBox,body.sheet-open #feed,body.sheet-open #chatToast,body.sheet-open .dock,body.sheet-open #dockTab,body.sheet-open .top-collapsible,body.sheet-open #topHandle,body.sheet-open #ig{opacity:0 !important;pointer-events:none !important;visibility:hidden !important}
body:has(#sheet.open) #fab,body:has(#sheet.open) #leftMenu,body:has(#sheet.open) #liveChatBox,body:has(#sheet.open) #feed,body:has(#sheet.open) #chatToast,body:has(#sheet.open) .dock,body:has(#sheet.open) #dockTab,body:has(#sheet.open) .top-collapsible,body:has(#sheet.open) #topHandle,body:has(#sheet.open) #ig{opacity:0 !important;pointer-events:none !important;visibility:hidden !important}
#sheet.full{max-height:calc(100vh - 157px)}
@media(min-width:768px){#sheet.full{width:480px;max-height:calc(100vh - 80px)}}
#sheet.open{transform:none}
@media(min-width:768px){#sheet{left:auto;right:16px;top:80px;bottom:84px;width:390px;max-height:calc(100vh - 164px);border-radius:22px;margin:0;transform:translateX(110%)}#sheet.open{transform:none}}
@media(prefers-reduced-motion:reduce){#sheet{transition:none}}
#sheet h3{font:700 1.25rem/1.15 Fredoka,sans-serif;color:var(--brand);margin:0 0 8px;padding-right:42px}
.sheet-closebar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:8px;background:var(--card);padding:4px 0 8px;margin:-4px 0 4px}
.sheet-closebar .xbig{height:48px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;font-weight:700;cursor:pointer}
.sheet-closebar .x{position:static;width:auto;height:48px;padding:0 18px;border-radius:999px;border:0;background:var(--gold);color:var(--ongold);font-size:15px;cursor:pointer;font-weight:700;box-shadow:0 3px 8px rgba(0,0,0,.25)}
label{display:grid;gap:5px;font-weight:700;margin-bottom:10px;font-size:.9rem}
input,select,textarea{font:600 15px Nunito,sans-serif;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;user-select:text;-webkit-user-select:text;touch-action:manipulation}
#liveChatBox,#liveChatBox input{pointer-events:auto}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:7px;margin:6px 0 12px}
.role{border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;padding:8px 10px;font:700 .88rem Fredoka,sans-serif;cursor:pointer;text-align:left;min-height:42px}
.role[aria-pressed=true]{background:var(--gold);color:var(--ongold);border-color:var(--brand)}
.tag{display:inline-block;border-radius:11px;padding:2px 9px;background:var(--gold);color:var(--ongold);font:700 .76rem Fredoka,sans-serif;margin:0 5px 5px 0}
.tag.ok{background:#C8E6C9;color:#1B5E20}
.tag.warn{background:#FFE0B2;color:#E65100}
.tag.bad{background:#FFCDD2;color:#B71C1C}
.q{margin:8px 0;padding:9px 12px;border-radius:14px;background:var(--bg);font-style:italic;border-left:4px solid var(--gold)}
.bar2{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0 8px}
.bar2 i{display:block;height:100%;background:var(--brand)}
.err{color:var(--bad);min-height:1.2em;font-size:.86rem;font-weight:700}
.note{font-size:.82rem;opacity:.86;margin:6px 0 0}
.res{display:grid;gap:7px;margin-top:8px}
.res button,.card-item{text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--text);padding:9px 12px;font:700 .9rem Nunito,sans-serif;cursor:pointer;min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;overflow-wrap:break-word}
.res button>*{min-width:0;flex-shrink:1}
.res button .tag{flex-shrink:0}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.stat-box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center}
.stat-box b{display:block;font:700 1.12rem Fredoka,sans-serif;color:var(--brand)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:99px;padding:6px 12px;font:700 .8rem Fredoka,sans-serif;cursor:pointer;white-space:nowrap}
.tabs button.act{background:var(--brand);color:var(--onb)}
body.photo-mode .top,body.photo-mode #feed,body.photo-mode .dock,body.photo-mode #sheet{opacity:0;pointer-events:none}
body.text-hidden .top,body.text-hidden #feed{opacity:0;pointer-events:none}
.top-handle{justify-self:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font:700 .75rem Fredoka,sans-serif;color:var(--text);cursor:pointer;box-shadow:0 3px 0 var(--shd);touch-action:none}
body.top-collapsed .top-collapsible{display:none}
#donorBar{background:var(--gold);color:var(--ongold);font:700 .74rem Nunito,sans-serif;padding:4px 10px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 3px 0 var(--shd)}
.donor-item{text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--text);padding:9px 12px;font:700 .9rem Nunito,sans-serif}
#exitPhoto{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:20;display:none}
body.photo-mode #exitPhoto{display:inline-flex}

.top-fixed{display:grid;gap:4px}
.top-collapsible{display:grid;gap:6px}
#donorTicker{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:5px 0;box-shadow:0 3px 0 var(--shd);font:700 .78rem Nunito,sans-serif;white-space:nowrap}
#donorTickerTrack{display:inline-block;padding-left:12px;animation:donorScroll 28s linear infinite}
@keyframes donorScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){#donorTickerTrack{animation:none}}
#wilayahBar,#pklBar,#keamananBar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px 12px;font:700 .78rem Nunito,sans-serif;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 3px 0 var(--shd)}
#wilayahBar span,#pklBar span,#keamananBar span{flex:1}
</style>
</head>

/* Muat SDK lewat dynamic import di dalam fungsi (script tetap classic, bukan module,
   jadi semua variabel top-level tetap global). Gagal import / gagal fetch = Mode Lokal. */
async function sbInit() {
  if (!sbHasKeys()) return null;
  try {
    const mod = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    sbClient = mod.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
    const q = Promise.all([
      sbClient.from('residents').select('*').order('created_at', { ascending: true }).limit(5000),
      sbClient.from('proposals').select('*'),
      sbClient.from('buildings').select('*')
    ]);
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout 8 detik')), 8000));
    const [rRes, rProp, rBld] = await Promise.race([q, timeout]);
    const err = rRes.error || rProp.error || rBld.error;
    if (err) throw new Error(err.message);
    sbMode = true;
    sbSetChip('🌐 Dunia Bersama Aktif');
    return { residents: rRes.data || [], proposals: rProp.data || [], buildings: rBld.data || [] };
  } catch (e) {
    sbClient = null; sbMode = false;
    sbSetChip('💾 Mode Lokal (Supabase tidak terjangkau)');
    return null;
  }
}

function sbSubscribe() {
  if (!sbClient || sbChannel) return;
  sbChannel = sbClient.channel('netizenia-world')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'residents' }, p => sbOnResidentInsert(p.new))
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'residents' }, p => sbOnResidentUpdate(p.new))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'proposals' }, p => sbOnProposalInsert(p.new))
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'proposals' }, p => sbOnProposalUpdate(p.new))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'buildings' }, p => sbOnBuildingUpdate(p.new))
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'buildings' }, p => sbOnBuildingUpdate(p.new))
    .subscribe(st => { if (st !== 'SUBSCRIBED') sbSetChip('💾 Mode Lokal (Realtime: ' + st + ')'); });
  /* TAHAP 2: kanal terpisah untuk settings — gagal di sini tidak boleh merusak kanal utama. */
  if (!sbSettingsChannel) {
    sbSettingsChannel = sbClient.channel('netizenia-settings')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'settings' }, p => { sbApplySettingsRow(p.new.key, p.new.value); updateChips(); })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'settings' }, p => { sbApplySettingsRow(p.new.key, p.new.value); updateChips(); })
      .subscribe();
  }
}

    a.y = d.y + a.oy * 0.4;
    a.loc = 'home';
  }
  ag.push(a);
  return a;
}

function door(a, l) {
  if (l === 'home') l = a.home;
  if (typeof l === 'number') {
    const p = plots[l] || plots[0];
    return { x: p.x, y: p.dy };
  }
  if (l === 'avenue') {
    const ang = Math.random() * Math.PI * 2;
    return { x: Math.cos(ang) * 125, y: Math.sin(ang) * 125 };
  }
  return DOOR[l] || { x: 0, y: 0 };
}

const locName = (a, l) => l === 'home' ? 'Rumah no. ' + (a.home + 1) : l === 'avenue' ? 'Bundaran Pusat Kota' : l === 'gate' ? 'Gerbang Utara' : (FAS[l] ? FAS[l].n : 'Kota');

/* ====== INDEKS KEPUASAN RAKYAT (PUAS / TIDAK PUAS) ====== */
function calcSatisfaction(a) {
  let score = 78;
  const reasons = [];
  const hp = typeof a.home === 'number' ? plots[a.home] : null;
  if (hp) {
    if (hp.pr >= 1) {
      score += 12;
      reasons.push('✅ Rumah sudah 100% jadi (' + hp.arch + ')');
    } else {
      score -= 22;
      reasons.push('🔨 Rumah no. ' + (hp.i + 1) + ' masih dibangun (' + Math.round(hp.pr * 100) + '%)');
    }
  }
  if (a.workStatus === 'nganggur') {
    score -= 18;
    reasons.push('☕ Masih nganggur & nongkrong di Posko Tukang');
  } else {
    score += 8;
    reasons.push('💼 Aktif bekerja sebagai ' + a.sub);
  }
  if (blackout) {
    score -= 25;
    reasons.push('⚡ Gardu PLN sedang pemeliharaan (mati lampu)');
  } else {
    score += 5;
    reasons.push('⚡ Listrik bawah tanah & air sungai lancar');
  }
  if (a.lapar > 0.72) {
    score -= 12;
    reasons.push('🍛 Perut lapar, butuh makan di Posko/Warung');
  }
  score = Math.max(15, Math.min(100, score));
  const label = score >= 80 ? 'Sangat Puas' : score >= 65 ? 'Puas' : score >= 48 ? 'Biasa' : 'Kurang Puas';
  const emoji = score >= 80 ? '😍' : score >= 65 ? '😊' : score >= 48 ? '😐' : '😤';
  return { score, label, emoji, reasons };
}

function citySatisfaction() {
  if (!ag.length) return { avg: 85, puas: 0, komplain: 0, unfinishedHouses: 0, nganggurCount: 0 };
  let sum = 0, puas = 0, komplain = 0, nganggurCount = 0;
  for (let i = 0; i < ag.length; i++) {
    const s = calcSatisfaction(ag[i]).score;
    sum += s;
    if (s >= 65) puas++; else komplain++;
    if (ag[i].workStatus === 'nganggur') nganggurCount++;
  }
  const unfinishedHouses = plots.filter(p => p.a && p.pr < 1).length;
  return { avg: Math.round(sum / ag.length), puas, komplain, unfinishedHouses, nganggurCount };
}

function buildRoadPath(x0, y0, x1, y1, ox, oy) {
  const pts = [];
  if (Math.abs(x0 - x1) > 90 && Math.abs(y0 - y1) > 90) {
    pts.push({ x: x0, y: 0 });
    pts.push({ x: x1, y: 0 });
  } else {
    pts.push({ x: (x0 + x1) * 0.5, y: (y0 + y1) * 0.5 });
  }
  pts.push({ x: x1 + ox * 0.55, y: y1 + oy * 0.55 });
  return pts;
}

function decide(a) {
  if (a.p === 'Penjahat') {
    if (a.crimePhase === 'jailed') { a.crimePhase = 'rest'; a.act = 'bebas dari penjara, istirahat di rumah'; const Dh = door(a, 'home'); a.path = buildRoadPath(a.x, a.y, Dh.x, Dh.y, a.ox, a.oy); a.dest = 'home'; a.inside = false; return; }
    if (a.crimePhase === 'rest') { a.crimePhase = 'idle'; }
    if (a.crimePhase === 'escorted') { a.act = 'dikawal polisi ke penjara ⛓️'; const D = door(a, 'penjara'); a.path = buildRoadPath(a.x, a.y, D.x, D.y, a.ox, a.oy); a.dest = 'penjara'; a.inside = false; return; }
    if (a.crimePhase === 'stealing') {
      const pol = ag.find(p => p.p === 'Polisi' && p.chaseThief === a && p.loc === a.loc);
      if (pol) {
        pol.chaseThief = null; pol.escortThief = a; pol.sp = 55 + (hs(pol.id + 11) * 25);
        a.crimePhase = 'escorted';
        noteLive('🚓 Polisi ' + pol.n + ' berhasil menangkap ' + a.n + ' dan menggiringnya ke Penjara!');
        a.act = 'tertangkap basah & diborgol polisi! ⛓️';
        const D2 = door(a, 'penjara'); a.path = buildRoadPath(a.x, a.y, D2.x, D2.y, a.ox, a.oy); a.dest = 'penjara'; a.inside = false; return;
      }
      a.act = 'mencuri bahan bangunan / kas! 💰';
      if (a.loc === a.stealTarget) { a.wait = 7; return; }
      const D3 = door(a, a.stealTarget); a.path = buildRoadPath(a.x, a.y, D3.x, D3.y, a.ox, a.oy); a.dest = a.stealTarget; a.inside = false; return;
    }
    if (a.crimePhase === 'toTarget') { a.act = 'mengendap-endap mau mencuri 🕵️'; const D4 = door(a, a.stealTarget); a.path = buildRoadPath(a.x, a.y, D4.x, D4.y, a.ox, a.oy); a.dest = a.stealTarget; a.inside = false; return; }
    const targets = ['posko','pasar','bank'];
    a.stealTarget = targets[a.id % targets.length]; a.crimePhase = 'toTarget';
    a.act = 'mengendap-endap mau mencuri 🕵️';
    const D5 = door(a, a.stealTarget); a.path = buildRoadPath(a.x, a.y, D5.x, D5.y, a.ox, a.oy); a.dest = a.stealTarget; a.inside = false; return;
  }
  if (a.p === 'Polisi' && a.escortThief) {
    const th = a.escortThief;
    if (th && th.crimePhase === 'escorted') { a.act = 'mengawal pencuri ke penjara'; const D = door(a, 'penjara'); a.path = buildRoadPath(a.x, a.y, D.x, D.y, a.ox, a.oy); a.dest = 'penjara'; a.inside = false; return; }
    a.escortThief = null;
  }
  if (a.p === 'Polisi' && a.chaseThief) {
    const th = a.chaseThief;
    if (th && (th.crimePhase === 'stealing' || th.crimePhase === 'toTarget')) {
      a.act = 'mengejar pencuri! 🚨 Berhenti kau pencuri!';
      const D = door(a, th.stealTarget || th.loc); a.path = buildRoadPath(a.x, a.y, D.x, D.y, a.ox, a.oy); a.dest = th.stealTarget || th.loc; a.inside = false; return;
    }
    a.chaseThief = null;
  }
  if (a.p === 'Pedagang') {
    const sub = a.sub || '';
    const shout = /Kopi/.test(sub) ? 'Kopi dingin/panas siap!' : /Warteg/.test(sub) ? 'Warteg buka 24 jam!' : /Lele/.test(sub) ? 'Pecel lele hangat!' : /Seblak/.test(sub) ? 'Seblak prasmanan pedas!' : /Martabak/.test(sub) ? 'Martabak manis gurih!' : /Mie/.test(sub) ? 'Mie ayam hangat!' : /Padang/.test(sub) ? 'Nasi padang rendang!' : /Gorengan/.test(sub) ? 'Gorengan hangat!' : /Angkringan/.test(sub) ? 'Angkringan buka, mampir!' : 'Dagangan segar, mampir!';
    a.act = 'dagang: ' + shout;

    const D = door(a, tgt); a.path = buildRoadPath(a.x, a.y, D.x, D.y, a.ox, a.oy); a.dest = tgt; a.inside = false; return;

    a.inside = target === 'home' && /tidur|santai di rumah|istirahat/.test(a.act);
    a.wait = /mencuri/.test(a.act) ? 7 : 18 + Math.random() * 14;
    think(a);
    return;
  }
  const D = typeof target === 'number' ? { x: plots[target].x, y: plots[target].dy } : door(a, target);
  a.inside = false;
  a.path = buildRoadPath(a.x, a.y, D.x, D.y, a.ox, a.oy);
  a.dest = target;
}

function arrive(a) {
  a.loc = a.dest;
  a.inside = a.dest === 'home' && /tidur|santai di rumah|istirahat/.test(a.act);
  a.wait = /mencuri/.test(a.act) ? 7 : 18 + Math.random() * 14;
  if (a.p === 'Penjahat' && a.crimePhase === 'toTarget' && a.loc === a.stealTarget) {
    a.crimePhase = 'stealing'; a.act = 'mencuri bahan bangunan / kas! 💰';
    const pols = ag.filter(p => p.p === 'Polisi' && !p.chaseThief && !p.escortThief);
    let bestPol = null, bd = 1e9;
    pols.forEach(p => { const d = Math.hypot(p.x - a.x, p.y - a.y); if (d < bd) { bd = d; bestPol = p; } });
    if (bestPol) { bestPol.chaseThief = a; bestPol.sp = 95; }
    note(a.n + ' (Penjahat) mengendap di ' + locName(a, a.loc) + '!');
  }
  if (a.p === 'Penjahat' && a.crimePhase === 'escorted' && a.loc === 'penjara') {
    a.crimePhase = 'jailed'; a.act = 'dipenjara di Penjara Netizenia ⛓️'; a.wait = 45;
    const pol = ag.find(p => p.escortThief === a); if (pol) pol.escortThief = null;
    noteLive('🔒 ' + a.n + ' resmi mendekam di Penjara Netizenia selama 45 detik.');
  }
  if (a.p === 'Polisi' && a.escortThief && a.loc === 'penjara') { a.escortThief = null; }
  if (/makan|ngopi/.test(a.act) && (a.loc === 'pkl' || a.loc === 'pasar' || a.loc === 'posko')) {
    const ped = ag.find(p => p.p === 'Pedagang' && p.loc === a.loc);
    if (ped) { a.buyT = 5; a.buyFrom = ped.n; a.act = 'membeli & makan di lapak @' + ped.n; a.lapar = 0; ped.buyT = 5; }
  }
  think(a);
  if (/makan|ngopi/.test(a.act)) a.lapar = 0;
  if (a.p === 'Tukang' || a.p === 'Mandor') {
    if (typeof a.loc === 'number' && plots[a.loc] && plots[a.loc].pr < 1) {
      plots[a.loc].pr = Math.min(1, plots[a.loc].pr + 0.08);
    } else if (FAS[a.loc] && FAS[a.loc].st === 'sebagian') {
      FAS[a.loc].pr = Math.min(1, FAS[a.loc].pr + 0.015);
      if (FAS[a.loc].pr >= 1) FAS[a.loc].st = 'jadi';
    }
  }
  if (Math.random() < 0.14 || a.me) {
    const place = typeof a.loc === 'number' ? 'Rumah no. ' + (a.loc + 1) : locName(a, a.loc);
    note(a.n + ' (' + a.p + ') ' + a.act + ' di ' + place);
  }
}

function stepA(a, dt) {
  if (a.buyT > 0) a.buyT -= dt;
  a.lapar = Math.min(1, a.lapar + 0.005 * dt);
  if (a.sayT > 0) a.sayT -= dt;
  if (!a.sys && typeof a.home === 'number' && plots[a.home] && plots[a.home].pr < 1) {
    plots[a.home].pr = Math.min(1, plots[a.home].pr + 0.0012 * dt);
  }
  if (a.path.length) {
    const q = a.path[0], dx = q.x - a.x, dy = q.y - a.y, d = Math.hypot(dx, dy), s = a.sp * dt;
    a.mv = true;
    if (d <= s) {
      a.x = q.x; a.y = q.y; a.path.shift();
      if (!a.path.length) { a.mv = false; arrive(a); }
    } else {
      a.x += dx / d * s; a.y += dy / d * s;
    }
  } else {
    a.mv = false; a.wait -= dt;
    if (a.wait <= 0) decide(a);
  }
}

function stepWorldEntities(dt) {
  fishes.forEach(f => {

    else if (c.type === 'v') { c.y += c.sp * c.dir * dt; if (c.y > 620) c.dir = -1; if (c.y < -420) c.dir = 1; }
  });
  cars.forEach(c => {
    if (c.type === 'ring') {
      c.ang += c.sp * dt;
      c.x = Math.cos(c.ang) * c.r;
      c.y = Math.sin(c.ang) * c.r;
    } else if (c.type === 'h') {
      c.x += c.sp * c.dir * dt;

      if (c.x < -820) c.dir = 1;
    } else if (c.type === 'v') {
      c.y += c.sp * c.dir * dt;
      if (c.y > 620) c.dir = -1;
      if (c.y < -420) c.dir = 1;
    }
  });
}

/* ====== RENDERING CLAYMATION 2D ====== */
const sc = {};
function shade(c, f) {
  const k = c + f; if (sc[k]) return sc[k];
  const n = parseInt(c.slice(1), 16), m = f < 0 ? 0 : 255, t = Math.abs(f);
  return sc[k] = 'rgb(' + [n >> 16, n >> 8 & 255, n & 255].map(v => Math.round(v + (m - v) * t)).join(',') + ')';
}
function rr(x, y, w, h, r, keep) { if (!keep) ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function clay(x, y, w, h, r, c, d) {
  d = d || 4;
  ctx.fillStyle = shade(c, -0.3); rr(x, y + d, w, h, r); ctx.fill();
  ctx.fillStyle = c; rr(x, y, w, h, r); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.3)'; rr(x + w * 0.1, y + h * 0.1, w * 0.8, Math.max(2, h * 0.14), r / 2); ctx.fill();
}

function drawHouse(p, t) {
  if (p.a && p.a.dayJoined > viewDay) return;
  const x = p.x, y = p.y, w = WALL[p.st * 6 | 0], ro = ROOF[hs(p.i + 9) * 6 | 0];
  ctx.globalAlpha = p.a ? 1 : 0.38;

  if (p.a && p.pr < 1) {
    ctx.fillStyle = 'rgba(120,95,65,.45)';
    rr(x - 26, y - 16, 52, 38, 7); ctx.fill();
    const hh = Math.max(8, 30 * p.pr);
    clay(x - 22, y + 18 - hh, 44, hh, 5, w, 3);
    ctx.strokeStyle = '#D9822B'; ctx.lineWidth = 2;
    ctx.strokeRect(x - 24, y - 18, 48, 36);
    clay(x + 14, y + 10, 12, 8, 2, '#C8553D', 2);
    if (cam.z >= 0.55) {
      const bounce = Math.sin(t * 9 + p.i) * 3;
      ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('🔨', x, y - 22 + bounce);
    }
  } else if (p.arch === 'batak') {
    clay(x - 22, y - 10, 44, 28, 5, '#D7B38C');
    ctx.fillStyle = '#8B3A2B';
    ctx.beginPath();
    ctx.moveTo(x - 30, y - 8);
    ctx.quadraticCurveTo(x, y - 22, x + 30, y - 8);
    ctx.lineTo(x + 24, y - 34);
    ctx.quadraticCurveTo(x, y - 18, x - 24, y - 34);

let donorCloudHit = [];
function activeDonorClouds() {
  const now = Date.now();
  const act = donorList.filter(d => {
    const amt = Number(d.amount) || 0;
    if (amt < 1000) return false;
    const hours = Math.max(1, Math.floor(amt / 1000));
    const exp = new Date(d.created_at).getTime() + hours * 3600 * 1000;
    return now < exp;
  });
  if (act.length) {
    if (act.length > 10) {
      const wins = Math.ceil(act.length / 10);
      const wi = Math.floor(now / 30000) % wins;
      const doubled = act.concat(act);
      return doubled.slice(wi * 10, wi * 10 + 10);
    }
    return act.slice(0, 10);
  }
  return []; /* tidak ada awan contoh lagi — awan hanya muncul untuk donatur asli */
}

function drawWorld(t) {

  [[-850,-390,220],[-520,-390,180],[-180,-390,240],[180,-390,190],[520,-390,230],[840,-390,170]].forEach((m, i) => {
    ctx.fillStyle = i % 2 ? '#3F7D5B' : '#4E8F6B';
    ctx.beginPath(); ctx.moveTo(m[0] - m[2], m[1]); ctx.lineTo(m[0], m[1] - m[2] * 0.85); ctx.lineTo(m[0] + m[2], m[1]); ctx.fill();
  });

  const vy0 = cam.y - H / 2 / cam.z - 50, vy1 = cam.y + H / 2 / cam.z + 50;
  const vx0 = cam.x - W / 2 / cam.z - 50, vx1 = cam.x + W / 2 / cam.z + 50;
  for (let y = Math.max(-380, Math.floor(vy0 / 54) * 54); y < Math.min(760, vy1); y += 54) {
    for (let x = Math.max(-1100, Math.floor(vx0 / 64) * 64); x < Math.min(1100, vx1); x += 64) {
      const r = hs(x * 7 + y * 13);

  }

  const road = (x, y, w, h) => {
    ctx.fillStyle = '#7C7E74'; ctx.fillRect(x, y + 3, w, h);
    ctx.fillStyle = '#A3A59A'; ctx.fillRect(x, y, w, h);
  };
  road(-32, -520, 64, 1200);
  road(-960, -18, 1920, 36);
  road(-960, -165, 1920, 26);
  road(-960, 150, 1920, 28);
  CLUSTERS.forEach(cl => {

  [-340, 0, 340].forEach(bx => {

  ctx.strokeStyle = '#F4EBD0'; ctx.lineWidth = 2.5; ctx.setLineDash([14, 12]);

  for (let i = 0; i < 48; i++) {

    const tx = Math.cos(ang) * rad, ty = Math.sin(ang) * (rad * 0.62);
    if (tx > vx0 - 40 && tx < vx1 + 40 && ty > vy0 - 40 && ty < vy1 + 40) {
      ctx.fillStyle = '#6B4A2B'; ctx.fillRect(tx - 3, ty, 6, 14);

  CONFIG.fas.forEach(f => drawFas(f, t));

function drawNightAndNames() {
  const h = hour(), n = (1 - Math.cos((h - 13) * Math.PI / 12)) / 2;
  const a = blackout ? 0.58 : 0.45 * Math.pow(n, 1.5);
  NIGHT = n;
  if (a > 0.01) {
    ctx.fillStyle = 'rgba(18,28,70,' + a + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (cam.z < 0.45) return;

  const L = [];
  for (let i = 0; i < ag.length; i++) {
    const agi = ag[i];
    if (agi.dayJoined > viewDay) continue;
    if (agi.inside && agi !== selA && !/tidur|masak/.test(agi.act)) continue;
    const sx = (agi.x - cam.x) * cam.z + W / 2;
    const sy = (agi.y - cam.y) * cam.z + H / 2 - 14 * Math.max(cam.z, 0.8) - 9;
    if (sx > -60 && sx < W + 60 && sy > 0 && sy < H) {
      L.push({ a: agi, sx, sy, d: Math.hypot(sx - W / 2, sy - H / 2) });
    }
  }
  L.sort((p, q) => (q.a === selA) - (p.a === selA) || (q.a.p === 'Presiden') - (p.a.p === 'Presiden') || p.d - q.d);

  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '700 11px Nunito,sans-serif';
  const cap = cam.z >= 1.2 ? 95 : cam.z >= 0.8 ? 55 : 32;
  L.slice(0, cap).forEach(({ a: agi, sx, sy }) => {
    const ch = Array.from(agi.n);
    const t = (agi.ig ? '@' : '') + (ch.length > 14 ? ch.slice(0, 13).join('') + '…' : agi.n);
    const w = ctx.measureText(t).width + 24;
    ctx.fillStyle = 'rgba(18,28,18,.94)';
    rr(sx - w / 2, sy - 9, w, 18, 9); ctx.fill();
    ctx.fillStyle = PERAN[agi.p].c;
    ctx.beginPath(); ctx.arc(sx - w / 2 + 9, sy, 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(t, sx - w / 2 + 16, sy + 0.5);
  });

  let bCount = 0;
  ctx.textAlign = 'center'; ctx.font = '700 11.5px Nunito,sans-serif';
  for (let i = 0; i < L.length && bCount < 7; i++) {
    const { a: agi, sx, sy } = L[i];
    if (!(agi.sayT > 0 || agi === selA) || !(agi === selA || cam.z >= 0.95)) continue;
    const t = agi.say || agi.th; if (!t) continue;
    bCount++;
    const tx = t.length > 36 ? t.slice(0, 35) + '…' : t;
    const w = ctx.measureText(tx).width + 16;
    ctx.fillStyle = 'rgba(18,28,18,.94)'; rr(sx - w / 2, sy - 32, w, 22, 11); ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.fillText(tx, sx, sy - 21);
  }
}

let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  tg += dt * 11;
  for (let i = 0; i < ag.length; i++) stepA(ag[i], dt);
  stepWorldEntities(dt);

  if (dirTour) {
    dirTimer -= dt;
    if (dirTimer <= 0) {
      const pt = TOUR_POINTS[dirStep % TOUR_POINTS.length];
      fly = { x: pt.x, y: pt.y, z: pt.z };
      note(pt.msg);
      dirStep++;
      dirTimer = 5.5;
    }
  }

  if (follow) { cam.x += (follow.x - cam.x) * 0.12; cam.y += (follow.y - cam.y) * 0.12; }
  if (fly) {
    cam.x += (fly.x - cam.x) * 0.12;
    cam.y += (fly.y - cam.y) * 0.12;
    cam.z += (fly.z - cam.z) * 0.12;
    if (Math.abs(fly.x - cam.x) + Math.abs(fly.y - cam.y) < 2 && Math.abs(fly.z - cam.z) < 0.02) fly = null;
  }
  cam.x = Math.max(-1050, Math.min(1050, cam.x));
  cam.y = Math.max(-560, Math.min(720, cam.y));

  ctx.setTransform(dpr * cam.z, 0, 0, dpr * cam.z, dpr * (W / 2 - cam.x * cam.z), dpr * (H / 2 - cam.y * cam.z));
  drawWorld(ts / 1000);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawNightAndNames();

  $('#sub').textContent = 'Hari ' + viewDay + ' • Jam ' + jam() + ' WIB • 👥 ' + Number(CONFIG.stats.followers || 0).toLocaleString('id-ID') + ' Followers';
  requestAnimationFrame(frame);
}

function setFocusMode(on, keep) {

  document.body.classList.add('focus-mode');

  if (dock) dock.style.display = 'none';
  if (tab) tab.style.display = 'none';

      if (res !== 'ok') { $('#clErr').textContent = 'Klaim gagal: ' + (res || 'respons tidak dikenal'); return; }
      sbPendingClaims[a.origName] = u;
      store.set('ntz_claims_pending_v1', sbPendingClaims);
      note('📨 Klaim @' + u + ' dikirim, menunggu persetujuan Presiden.');
      closeSheet();
      return;
    }
    claimsMap[a.origName] = u;
    store.set('ntz_claims_v3', claimsMap);
    a.n = u; a.ig = true;
    if (bc) bc.postMessage({ type: 'claim', orig: a.origName, u });
    note('✅ Nama ' + a.origName + ' diklaim menjadi @' + u);
    infoA(a);
  };
  $('#bHapusNama').onclick = async () => {
    let sbRes = '';
    if (sbMode) {
      try { sbRes = await sbRpc('opt_out_resident', { p_name: a.origName }); }
      catch (e) { $('#clErr').textContent = 'Gagal menghubungi Supabase: ' + e.message + ' — nama belum dihapus.'; return; }
      if (sbRes !== 'ok' && sbRes !== 'not_found') { $('#clErr').textContent = 'Hapus nama gagal: ' + (sbRes || 'respons tidak dikenal'); return; }
      if (sbRes === 'not_found') note('Nama ini belum ada di database — dihapus dari perangkat ini saja.');
    }
    optOutMap[a.origName] = true;
    store.set('ntz_optout_v3', optOutMap);
    if (typeof a.home === 'number' && plots[a.home]) plots[a.home].a = null;
    const idx = ag.indexOf(a); if (idx >= 0) ag.splice(idx, 1);
    updateChips(); closeSheet();
    if (!sbMode || sbRes === 'ok') note('Nama berhasil dihapus dari kota.');
  };
}

function openProposals() {
  const votes = store.get('ntz_votes_v3', {});
  const votesFb = store.get('ntz_votes_fb_v3', {});
  const props = CONFIG.proposals.map(p => {
    const votedSb = Object.prototype.hasOwnProperty.call(votes, p.id);
    const voted = votedSb || !!votesFb[p.id];
    /* Mode Dunia Bersama: total = angka database (sudah termasuk vote sendiri
       begitu RPC mengembalikannya), jadi penanda lokal tidak ikut dijumlahkan. */
    const total = p.votes + (sbMode && votedSb ? 0 : (votes[p.id] || 0)) + (votesFb[p.id] || 0);
    return { ...p, voted, total };
  }).sort((a, b) => b.total - a.total);
  openSheet(
    '<h3>📋 Papan Usulan Komentar Netizen</h3>' +
    '<p class="note">Komen di Instagram = Usulan. Usulan dengan vote tertinggi langsung dikerjakan oleh David dan para Tukang!</p>' +
    '<div class="res" id="propList">' +
      props.map((p, idx) => {
        const stBadge = p.status === 'done' ? '✅ Sudah Jadi' : p.status === 'building' ? '🔨 Sedang Dibangun' : idx === 0 ? '🏆 Dibangun Besok' : '🗳️ Terbuka';
        return '<div class="card-item">' +
          '<div><b>' + esc(p.title) + '</b><br><small>Pengusul: ' + esc(p.proposer) + ' • ' + stBadge + '</small></div>' +
          '<button class="btn ' + (p.voted ? 'soft' : 'gold') + '" data-pid="' + p.id + '" style="min-height:36px;padding:0 12px">👍 ' + p.total + '</button>' +
        '</div>';
      }).join('') +
    '</div>',
    'usulan'
  );
  $('#propList').onclick = async e => {
    const b = e.target.closest('button[data-pid]'); if (!b) return;
    const pid = b.dataset.pid;
    if (sbMode) {
      const votedSb = Object.prototype.hasOwnProperty.call(votes, pid);
      if (votedSb || votesFb[pid]) { note('Kamu sudah vote usulan ini.'); openProposals(); return; }
      try {
        const res = await sbRpc('increment_proposal_vote', { p_id: pid, device_id: sbDeviceId });
        if (typeof res === 'string' && res.indexOf('ok:') === 0) {
          const p = CONFIG.proposals.find(x => x.id === pid);
          if (p) p.votes = parseInt(res.slice(3), 10);
          votes[pid] = 1; store.set('ntz_votes_v3', votes);
          if (bc) bc.postMessage({ type: 'vote', pid });
          openProposals(); return;
        }
        if (typeof res === 'string' && res.indexOf('already_voted:') === 0) {
          const p = CONFIG.proposals.find(x => x.id === pid);
          if (p) p.votes = parseInt(res.slice(14), 10);
          votes[pid] = 1; store.set('ntz_votes_v3', votes);
          note('Kamu sudah vote usulan ini.');
          openProposals(); return;
        }
        throw new Error(res || 'respons RPC tidak dikenal');
      } catch (err) {
        /* Fallback: vote lokal saja (perilaku lama). Penanda fallback mencegah vote
           ganda di perangkat ini, karena RPC bisa saja sudah berhasil di server
           tapi responsnya hilang di jalan. */
        votesFb[pid] = (votesFb[pid] || 0) + 1;
        store.set('ntz_votes_fb_v3', votesFb);
        if (bc) bc.postMessage({ type: 'vote', pid });
        note('Vote tersimpan lokal saja — Supabase tidak terjangkau (' + err.message + ').');
        openProposals(); return;
      }
    }
    votes[pid] = (votes[pid] || 0) + 1;
    store.set('ntz_votes_v3', votes);
    if (bc) bc.postMessage({ type: 'vote', pid });
    openProposals();
  };
}

/* ====== TAHAP 2 — Panel Admin (Google OAuth) ======
   Login admin memakai Google OAuth milik Presiden (BUKAN email+password,
   dan BUKAN PIN — PIN di halaman bisa dibaca lewat view-source).
   Panel hanya terbuka bila sesi Auth ada DAN auth.uid() terdaftar di
   tabel public.admins (dicek lewat RPC is_admin). Tanpa itu, panel tidak
   terbuka dan tidak ada RPC admin yang bisa dipanggil (semuanya menolak
   'forbidden' di server). Mode lokal (tanpa kunci / Supabase tak
   terjangkau) memakai panel lama tanpa auth. */
async function openAdmin() {
  if (!sbHasKeys() || !sbMode) { openAdminLocal(); return; }
  let session = null;
  try { const r = await sbClient.auth.getSession(); session = r.data.session; } catch (e) {}
  if (!session) { openAdminLogin(''); return; }
  let chk = '';
  try { chk = await sbRpc('is_admin', {}); }
  catch (e) { openAdminLogin('Gagal memeriksa status presiden: ' + e.message + ' — pastikan migrasi Tahap 2 sudah dijalankan.'); return; }
  if (chk !== 'true') { openAdminNotAdmin(session); return; }
  openAdminPanel(session);
}

/* ====== INTERAKSI SENTUH, PAN, ZOOM & KLIK ENTITAS ====== */
const ptrs = new Map(); let moved = 0, multi = false, p0 = 0;
const zoomBy = f => { cam.z = Math.min(2.4, Math.max(0.28, cam.z * f)); fly = null; };

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) { moved = 0; multi = false; }
  else { multi = true; const [a, b] = [...ptrs.values()]; p0 = Math.hypot(a.x - b.x, a.y - b.y); }
});
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size === 1 && moved > 6) {
    cam.x -= dx / cam.z; cam.y -= dy / cam.z;
    follow = null; fly = null; dirTour = false;
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (p0) zoomBy(d / p0); p0 = d;
  }
});
const up = e => {
  const was = ptrs.size; ptrs.delete(e.pointerId);
  if (was === 1 && moved < 8 && !multi && e.type === 'pointerup') tap(e.clientX, e.clientY);
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.12 : 0.89); }, { passive: false });

function tap(sx, sy) {
  const wx = (sx - W / 2) / cam.z + cam.x, wy = (sy - H / 2) / cam.z + cam.y;
  const cloud = donorCloudHit.find(c => Math.abs(c.x - wx) < 90 && Math.abs(c.y - wy) < 55);
  if (cloud) { openDonorCloudPopup(cloud.d, cloud.hours, cloud.remainMs); return; }
  if (Math.hypot(cat.x - wx, cat.y - wy) < 20) {
    note('🐱 Meong! Ini ' + cat.name + ' yang suka ikut rapat di Rumah Pak Mulyo.');
    return;
  }
  const hitCar = cars.find(c => Math.abs(c.x - wx) < 24 && Math.abs(c.y - wy) < 14);
  if (hitCar) {
    note('🚗 ' + hitCar.n + ' sedang melintas di jalan raya.');
    return;
  }
  let best = null, bd = 1e9;
  ag.forEach(a => {
    if (a.dayJoined > viewDay) return;
    const d = Math.hypot(a.x - wx, a.y - 6 - wy);
    if (d < bd) { bd = d; best = a; }
  });
  if (best && bd < (15 / cam.z + 8)) { selA = best; selP = null; follow = best; return infoA(best); }
  const f = CONFIG.fas.find(f => f.day <= viewDay && Math.abs(f.x - wx) < f.w / 2 + 6 && Math.abs(f.y - wy) < f.h / 2 + 6);
  if (f) { selP = f; selA = null; follow = null; return infoF(f); }
  const p = plots.find(p => Math.abs(p.x - wx) < 28 && Math.abs(p.y - 6 - wy) < 28);
  if (p) {
    follow = null;
    if (mode === 'daftar' && !p.a) { pickPlot = p.i; $('#rt').textContent = 'No. ' + (p.i + 1) + ' (' + p.clName + ')'; return; }
    selP = p; return infoP(p);
  }
  if (mode) closeSheet();
}

  h.addEventListener('pointerdown', e => { sy = e.clientY; });

/* LIVE CHAT POJOK KIRI BAWAH: hanya 6 terbaru, baru dari bawah, lama tenggelam. */
let liveChatEntries = [];
function pushLiveChat(kind, user, text) {
  liveChatEntries.push({ kind, user, text, ts: Date.now() });
  liveChatEntries = liveChatEntries.slice(-6);
  renderLiveChat();
}
function renderLiveChat() {
  const el = document.getElementById('liveChatStream');
  if (!el) return;
  el.innerHTML = liveChatEntries.length ? liveChatEntries.map(m => m.kind === 'sys'
    ? '<div class="live-msg sys">✨ ' + esc(m.text) + '</div>'
    : '<div class="live-msg"><b>' + esc(m.user) + '</b> ' + esc(censorText(m.text)) + '</div>').join('')
    : '<div class="live-msg sys">Belum ada chat. Sapa rakyat dulu!</div>';
}
function noteLive(t) { note(t); pushLiveChat('sys', '', t); bumpNotifBadge(); }
async function sendLiveChat() {
  const nmEl = document.getElementById('liveChatName'), txEl = document.getElementById('liveChatText');
  if (!nmEl || !txEl) return;
  const u = nmEl.value.trim(), t = censorText(txEl.value.trim());
  if (!u || !t) return;
  try { localStorage.setItem('ntz_chat_name', u); } catch (e) {}
  if (!sbClient) { pushLiveChat('chat', u, t); txEl.value = ''; note('Mode Lokal: pesan live chat hanya tampil di perangkat ini.'); return; }
  try {
    const res = await sbRpc('send_chat_message', { p_username: u, p_text: t });
    if (res === 'ok') { pushLiveChat('chat', u, t); txEl.value = ''; }
    else if (res === 'slow_down') { note('Live chat: terlalu cepat — tunggu sebentar lalu kirim lagi.'); }
    else if (res === 'invalid_user') { note('Live chat: username harus 1–30 karakter.'); }
    else if (res === 'invalid_text') { note('Live chat: pesan harus 1–200 karakter.'); }
    else { note('Live chat: pesan gagal dikirim.'); }
  } catch (e) { note('Live chat gagal: ' + e.message); }
}

  document.body.classList.remove('livechat-hidden');

/* PESAN RAKYAT: obrolan publik sementara — hanya 30 pesan terbaru yang tampil; yang tenggelam harus chat ulang. Notifikasi TIDAK di kiri: badge di tombol + toast tengah bawah. */
let chatList = [], sbChatChannel = null, chatUnread = 0, chatToastTimer = null;
function renderChatList(){
  const el = document.getElementById('chatList');
  if (!el) return;
  el.innerHTML = chatList.length ? chatList.map(m => '<div class="chat-item"><b>' + esc(m.username) + '</b> <small style="opacity:.7">' + fmtTgl(m.created_at) + '</small><br>' + esc(censorText(m.text)) + '</div>').join('') : '<p class="note">Belum ada pesan. Jadilah yang pertama menyapa rakyat!</p>';
}
function setChatBadge(){
  const b = document.getElementById('chatBadge');
  if (!b) return;
  b.textContent = chatUnread;
  b.style.display = chatUnread > 0 ? '' : 'none';
}
function showChatToast(m){
  const t = document.getElementById('chatToast');
  if (!t) return;
  t.textContent = '💬 ' + m.username + ': ' + m.text;
  t.classList.add('show');
  clearTimeout(chatToastTimer);
  chatToastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}
function onChatNew(row){
  if (!row) return;
  chatList.unshift(row); chatList.length = Math.min(chatList.length, 30);
  const lastLive = liveChatEntries[liveChatEntries.length - 1];
  if (!(lastLive && lastLive.user === row.username && lastLive.text === row.text && Date.now() - lastLive.ts < 5000)) pushLiveChat('chat', row.username, row.text);
  if (mode === 'chat') { renderChatList(); }
  else if (!document.body.classList.contains('chat-open')) { chatUnread++; setChatBadge(); bumpChatBadge(); }
}
async function sbLoadChat(){
  if (!sbClient) return;
  try {
    const { data, error } = await sbClient.from('chat_messages').select('*').order('created_at', { ascending: false }).limit(30);
    if (!error && data) chatList = data;
  } catch (e) { /* abaikan: tabel belum ada = obrolan kosong */ }
  renderChatList();
  liveChatEntries = chatList.slice(0, 6).reverse().map(m => ({ kind: 'chat', user: m.username, text: m.text, ts: new Date(m.created_at).getTime() || Date.now() }));
  renderLiveChat();
  try {
    if (!sbChatChannel) {
      sbChatChannel = sbClient.channel('netizenia-chat')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, p => onChatNew(p.new))
        .subscribe();
    }
  } catch (e) { /* abaikan */ }
}

  };
  document.getElementById('chatSend').onclick = send;
  document.getElementById('chatText').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
}
$('#bChat').onclick = () => toggleChatMenu();

$('#bDay').onclick = () => {
  viewDay = viewDay >= 3 ? 1 : viewDay + 1;
  $('#epTag').textContent = 'HARI ' + viewDay;
  const epTitles = {
    1: '📢 HARI 1: Rakyatnya nol. Yang berkuasa satu (Pak Mulyo di Pusat Kota).',
    2: '📢 HARI 2: Rumah warga, RS gratis, Sungai & Gardu PLN mulai berdiri.',
    3: '📢 HARI 3: Pelamar menteri banyak, tukang lembur bangun rumah & fasilitas!'
  };
  $('#bannerTxt').textContent = epTitles[viewDay] || ('📢 HARI ' + viewDay + ': Kota terus dibangun rakyat!');
  updateChips();
};

/* FAB kanan bawah: tombol teknis (+, −, 📸, 🙈, 🎬) dipindah dari dock/top ke kolom vertikal kecil. */
(function setupFab() {
  const fab = document.createElement('div'); fab.id = 'fab'; document.body.appendChild(fab);
  ['bFoto','bIn','bOut','bTeks','bDir'].forEach(id => { const el = document.getElementById(id); if (el) fab.appendChild(el); });
  const bd = document.getElementById('bDir'); if (bd) bd.textContent = '🎬';

  const chip = document.getElementById('sbChip');
  if (topPill && chip) { chip.style.display = 'inline-block'; chip.style.marginLeft = '6px'; topPill.appendChild(chip); }
  const topRakyat = document.createElement('span'); topRakyat.id = 'topRakyat'; topRakyat.className = 'tag'; topRakyat.style.marginLeft = '6px';
  if (topPill) topPill.appendChild(topRakyat);
  topRakyat.style.cursor = 'pointer'; topRakyat.onclick = () => toggleMenu('cari', openCari);
})();
$('#bDir').onclick = () => {
  dirTour = !dirTour;
  if (dirTour) {
    dirStep = 0; dirTimer = 0.1;
    document.body.classList.add('photo-mode');
  } else {
    document.body.classList.remove('photo-mode');
  }
};

  setTimeout(() => {
    try {

      a.download = 'Republik-Netizenia-Hari-' + viewDay + '.png';

if (bc) {
  bc.onmessage = e => {
    const d = e.data;
    if (d.type === 'register') {
      addAgent(d.n, d.p, d.h, true, false);
      updateChips();
      note('🌐 Rakyat baru bergabung secara live: @' + d.n + ' (' + d.p + ')');
    } else if (d.type === 'claim') {
      const target = ag.find(a => a.origName === d.orig);
      if (target) { target.n = d.u; target.ig = true; }
    }
  };
}

/* ====== INISIALISASI KOTA RADIAL & DEEP LINK ====== */
function checkDeepLink() {
  const hash = decodeURIComponent(location.hash.replace(/^#/, '')).trim().toLowerCase();
  if (!hash) return;
  const q = hash.replace(/^rumah-/, '').replace(/^@/, '');
  const target = ag.find(a => a.n.toLowerCase().includes(q) || a.origName.toLowerCase().includes(q));
  if (target) {
    selA = target; follow = target;
    fly = { x: target.x, y: target.y, z: 1.3 };
    infoA(target);
  }
}

/* TAHAP 1 SUPABASE — boot kota: sinkron snapshot dulu (bila kunci ada), baru sebar benih warga.
   Tanpa kunci / bila Supabase tidak terjangkau, snap = null dan kota jalan lokal persis seperti biasa. */
async function boot() {
  let snap = null;
  if (sbHasKeys()) {
    try { snap = await sbInit(); } catch (e) { snap = null; }
  }
  if (snap) {
    /* (a) Klaim & opt-out dari database -> peta lokal sesi ini. */
    snap.residents.forEach(r => {
      if (r.opt_out) optOutMap[r.display_name] = true;
      else if (r.claimed && r.ig_username) claimsMap[r.display_name] = r.ig_username;
    });
    /* (d) Bangunan dari database menimpa CONFIG.fas (status & progres). */
    snap.buildings.forEach(b => {
      const f = FAS[b.id];
      if (f) {
        if (['usulan', 'sebagian', 'jadi'].indexOf(b.status) >= 0) f.st = b.status;
        if (typeof b.progress === 'number') f.pr = Math.max(0, Math.min(1, b.progress));
      }
    });
    /* (e) Usulan dari database menimpa (vote/status) atau menambah papan usulan. */
    snap.proposals.forEach(pr => {
      const ex = CONFIG.proposals.find(p => p.id === pr.id);
      if (ex) { ex.votes = pr.votes; ex.status = pr.status; }
      else CONFIG.proposals.push({ id: pr.id, title: pr.title, proposer: pr.proposer || 'Warga', votes: pr.votes || 0, status: pr.status || 'open', day: pr.build_day || 3 });
    });
  }
  const SEEDS = CONFIG.warga.concat(Object.entries(CONFIG.seed).flatMap(([p, l]) => l.map(n => ({ n, p }))));
  const savedLocal = store.get('ntz_w_radial', []);
  const overlayByLower = {};
  if (snap) snap.residents.forEach(r => { overlayByLower[String(r.display_name).toLowerCase()] = r; });
  const seenLower = new Set(['pak mulyo']);
  let maxDbPlot = -1;
  if (snap) snap.residents.forEach(r => { if (Number.isInteger(r.plot_id) && r.plot_id > maxDbPlot) maxDbPlot = r.plot_id; });
  ensurePlots(Math.ceil(Math.max(CONFIG.kapasitas, SEEDS.length + savedLocal.length + 24, maxDbPlot + 1) / 24) * 24);

  addAgent('Pak Mulyo', 'Presiden', null, true, true);
  SEEDS.forEach((w, i) => {
    const ov = overlayByLower[String(w.n).toLowerCase()];
    seenLower.add(String(w.n).toLowerCase());
    if (ov && ov.opt_out) { optOutMap[w.n] = true; return; }
    if (ov && ov.claimed && ov.ig_username) claimsMap[w.n] = ov.ig_username;
    const role = ov && PERAN[ov.role] ? ov.role : w.p;
    const plot = ov && Number.isInteger(ov.plot_id) && ov.plot_id >= 0 ? ov.plot_id : (w.h != null ? w.h : i);
    const a = addAgent(w.n, role, plot, true, false);
    /* Benih: progres rumah dari database hanya dipakai bila < 1. Nilai default
       1.0 di database TIDAK boleh memalsukan rumah benih yang masih dibangun. */
    if (a && ov && typeof ov.house_progress === 'number' && ov.house_progress >= 0 && ov.house_progress < 1 && typeof a.home === 'number' && plots[a.home]) {
      plots[a.home].pr = ov.house_progress;
    }
  });
  savedLocal.forEach(w => {
    seenLower.add(String(w.n).toLowerCase());
    const a = addAgent(w.n, w.p, w.h, true, false);
    if (a) a.me = a.ig = true;
  });
  /* (b) Warga database yang belum ada di benih / lokal -> agen tambahan. */
  if (snap) snap.residents.forEach(r => {
    const low = String(r.display_name).toLowerCase();
    if (seenLower.has(low) || r.opt_out) return;
    seenLower.add(low);
    const role = PERAN[r.role] ? r.role : 'Warga';
    const a = addAgent(r.display_name, role, Number.isInteger(r.plot_id) ? r.plot_id : null, true, false);
    if (a && typeof a.home === 'number' && plots[a.home] && typeof r.house_progress === 'number' && r.house_progress >= 0 && r.house_progress <= 1) {
      plots[a.home].pr = r.house_progress;
    }
  });

  addEventListener('hashchange', checkDeepLink);
  setTimeout(checkDeepLink, 300);

  updateChips();
  note('Selamat datang di Republik Netizenia! Presiden di tengah kota, ketuk warga atau bangunan untuk melihat aktivitasnya.');
  if (sbMode) sbSubscribe();
  if (sbMode) sbLoadSettings();
  if (sbMode) sbLoadDonations();
  if (sbMode) sbLoadChat();
  /* TAHAP 2: kembali dari login Google — bersihkan token dari URL, lalu
     buka panel admin bila tombol admin yang memicu login tadi. */
  try {
    if (sbMode && location.hash.indexOf('access_token') >= 0) history.replaceState(null, '', location.pathname + location.search);
    if (sbMode && sessionStorage.getItem('ntz_admin_after_login') === '1') {
      sessionStorage.removeItem('ntz_admin_after_login');
      sbClient.auth.getSession().then(r => { if (r.data.session) openAdmin(); }).catch(() => {});
    }
  } catch (e) {}
  requestAnimationFrame(frame);
}
boot();
