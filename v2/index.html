<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Republik Netizenia</title>
<meta name="description" content="Kota 3D yang dibangun bersama warga dari komen. Bangun rumah, kerja, dan voting bangunan umum.">
<meta name="theme-color" content="#2F8F5B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  color-scheme: light;
  --ink:#1D2B33; --muted:#5E6E77; --line:rgba(29,43,51,.12);
  --panel:rgba(255,255,255,.94); --panel-solid:#FFFFFF; --panel2:#F3F6EF;
  --red:#D9483B; --red-ink:#8E2318; --green:#2F8F5B; --green-ink:#17502F; --cream:#FFF6E3;
  --gold:#F2B531; --gold-ink:#3D2A00; --gold-soft:#FFF0C7; --blue:#3E6FB0; --blue-soft:#E3ECF8;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 10px 30px rgba(18,38,30,.18),0 2px 6px rgba(18,38,30,.12);
  --r:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#BFE0EC;color:var(--ink);font:700 14px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}

/* ---------- label 3D ---------- */
.lbl{position:absolute;left:0;top:0;background:var(--panel-solid);border-radius:12px;padding:4px 9px 5px;font:800 11px/1.25 var(--f-body);box-shadow:var(--shadow);white-space:nowrap;display:flex;flex-direction:column;gap:3px;align-items:center;will-change:transform}
.lbl:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--panel-solid)}
.lbl .bar{width:54px;height:6px;border-radius:3px;background:#E6EAE1;overflow:hidden}.lbl .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#F7D36B)}
.lbl.vote{border:2px solid var(--blue)}
.lbl .vb{display:flex;gap:6px}.lbl .y{color:var(--green)}.lbl .n{color:var(--red)}
.lbl.mine{border:2px solid var(--gold)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(8px + var(--safe-t)) max(10px,var(--safe-r)) calc(10px + var(--safe-b)) max(10px,var(--safe-l))}
#hud .top,#hud .bottom{display:flex;flex-direction:column;gap:7px;pointer-events:none}
#hud .top > *,#hud .bottom > *{pointer-events:auto}
.row1{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.chip{display:flex;align-items:center;gap:9px;border:0;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:5px 12px 5px 5px;min-height:46px;max-width:min(60vw,300px);text-align:left}
.chip .t{display:flex;flex-direction:column;min-width:0}
.chip b{font:600 14px/1.15 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{font-size:11.5px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;font:700 13px var(--f-display);flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.coin{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE7A0,#F2B531 55%,#C98A0E);color:#7A4E00;font:900 8px/1 var(--f-body);box-shadow:inset 0 -1px 0 rgba(0,0,0,.2)}
.ebar{width:46px;height:6px;border-radius:3px;background:#E6EAE1;overflow:hidden;display:inline-block}.ebar i{display:block;height:100%;background:linear-gradient(90deg,#2F8F5B,#7CCB6A)}
.login-chip{background:linear-gradient(135deg,#2F8F5B,#3FA86B);color:#fff;padding:5px 14px 5px 6px}
.login-chip .av{background:rgba(255,255,255,.22)}
.login-chip small{color:rgba(255,255,255,.85)}
.clock{display:flex;align-items:center;gap:7px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:6px 12px;min-height:46px;border:0}
.clock .ic{width:26px;height:26px;border-radius:50%;flex:none}
.clock b{font:600 16px/1 var(--f-display)}
.clock small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.stats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px;justify-content:center}
.stats::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;align-items:center;gap:7px;background:var(--panel);border-radius:999px;box-shadow:var(--shadow);padding:5px 12px 5px 6px;border:0}
.pill .pi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.pill .pi svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pill b{font:600 14.5px/1 var(--f-display)}
.pill small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;line-height:1.1}
.ticker{align-self:center;background:rgba(29,43,51,.78);color:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;max-width:min(620px,100%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow)}
.ticker b{color:#FFE08A}
.banner{align-self:center;display:flex;gap:10px;align-items:center;background:var(--cream);border:1.5px solid var(--gold);border-radius:14px;padding:7px 8px 7px 12px;box-shadow:var(--shadow);max-width:min(560px,100%);font-size:12.5px}
.banner .btn{min-height:34px;padding:5px 12px}

.next{align-self:center;display:flex;align-items:center;gap:10px;border:0;background:linear-gradient(135deg,#FFE18A,#F2B531);color:var(--gold-ink);border-radius:999px;padding:7px 16px 7px 8px;box-shadow:0 8px 22px rgba(242,181,49,.45),var(--shadow);font:800 13.5px var(--f-body);max-width:100%}
.next .ni{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.65);display:grid;place-items:center;flex:none}
.next .ni svg{width:17px;height:17px;fill:none;stroke:var(--gold-ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.next{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}}

.dock{align-self:center;display:flex;gap:4px;background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:6px;max-width:100%}
.dock button{position:relative;flex:1 1 0;min-width:62px;border:0;background:none;border-radius:16px;padding:7px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font:800 11.5px/1.1 var(--f-body);color:var(--muted)}
.dock .di{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--panel2);transition:transform .15s}
.dock .di svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dock button[aria-pressed="true"]{color:var(--ink)}
.dock button[aria-pressed="true"] .di{background:linear-gradient(135deg,#FFE18A,#F2B531);transform:translateY(-3px);box-shadow:0 6px 14px rgba(242,181,49,.45)}
.dock button[data-dock="bangun"] .di{background:linear-gradient(135deg,#E9F6E3,#CDEBC1)}
.badge{position:absolute;top:2px;right:calc(50% - 26px);min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font:900 10.5px/19px var(--f-body);padding:0 5px;box-shadow:0 0 0 2px #fff}

.fabs{position:fixed;right:max(10px,var(--safe-r));bottom:calc(var(--safe-b) + 150px);display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.fab{width:44px;height:44px;border-radius:14px;border:0;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:21px;height:21px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- panel (sheet) ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel-solid);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(18,38,30,.25);display:flex;flex-direction:column;max-height:72vh;padding-bottom:var(--safe-b);transition:transform .22s ease}
.sheet.full{max-height:calc(100vh - 60px - var(--safe-t))}
.sheet .grab{flex:none;height:22px;display:grid;place-items:center;cursor:grab;touch-action:none}
.sheet .grab i{width:42px;height:5px;border-radius:3px;background:#D5DBD2}
.sheet-h{display:flex;align-items:center;gap:10px;padding:0 16px 10px}
.sheet-h .hi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.sheet-h .hi svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet-h h2{font:600 20px/1.15 var(--f-display);margin:0;flex:1;min-width:0;text-wrap:balance}
.sheet-h h2 small{display:block;font:700 12px var(--f-body);color:var(--muted)}
.x{border:0;background:var(--panel2);border-radius:12px;width:38px;height:38px;flex:none;display:grid;place-items:center}
.x svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round}
.sheet-b{padding:2px 16px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0;-webkit-overflow-scrolling:touch}
@media (min-width:900px){
  .sheet{left:auto;right:16px;top:calc(16px + var(--safe-t));bottom:16px;width:400px;max-height:none;border-radius:24px}
  .sheet.full{max-height:none}
  .sheet .grab{display:none}
  .sheet-h{padding-top:16px}
  body.sheet-open .fabs{right:432px}
  body.sheet-open #hud{padding-right:432px}
}

.tabs{display:flex;gap:6px;background:var(--panel2);border-radius:14px;padding:4px}
.tab{flex:1;border:0;background:none;border-radius:11px;padding:8px 6px;font-weight:800;font-size:13px;color:var(--muted)}
.tab[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.note{font-size:13px;color:var(--muted);margin:0;font-weight:700}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900;margin-bottom:-6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative}
.card .im{width:100%;aspect-ratio:4/3;border-radius:11px;background:linear-gradient(180deg,#D8EEF6,#EAF5E1);display:block;object-fit:cover}
.card b{font:600 14px/1.2 var(--f-display);padding:2px 2px 0}
.card small{font-size:11.5px;color:var(--muted);padding:0 2px}
.card .pr{display:flex;align-items:center;gap:5px;font-weight:900;font-size:13px;padding:2px 2px 2px}
.card:disabled{opacity:.5;cursor:not-allowed}
.card.free{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.card .tag{position:absolute;top:10px;left:10px;background:var(--gold);color:var(--gold-ink);font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:9px 14px;font-weight:800;font-size:13.5px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:linear-gradient(135deg,#FFE18A,#F2B531);border-color:#E6A622;color:var(--gold-ink)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{background:#fff;border-color:var(--red);color:var(--red)}
.btn.redfill{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{min-height:36px;padding:6px 11px;font-size:12.5px;border-radius:11px}
.btn.wide{width:100%}
.btn.busy{opacity:.6;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > .btn{flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:11px;align-items:center;padding:10px;border-radius:14px;background:var(--panel2)}
.item .grow{flex:1;min-width:0}
.item .grow b{display:block;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .grow small{color:var(--muted);font-size:12px;display:block}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tagc{display:inline-block;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px;background:#fff;border:1px solid var(--line);margin-left:4px;vertical-align:1px}
.tagc.red{background:#FDE7E4;border-color:#F3B6AE;color:#9B2C21}
.tagc.blue{background:var(--blue-soft);border-color:#B3C8E8;color:#26497A}
.tagc.gold{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)}
.tagc.green{background:#E1F2E7;border-color:#A9D8BA;color:#1D5E3A}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 12px;margin:0;font-size:13.5px;background:var(--panel2);border-radius:14px;padding:12px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.meter{height:9px;border-radius:5px;background:#E6EAE1;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7CCB6A);border-radius:5px}
.meter.gold i{background:linear-gradient(90deg,var(--gold),#F7D36B)}
.bars{display:grid;grid-template-columns:104px 1fr 42px;gap:9px 10px;align-items:center;font-size:13px}
.bars .p{text-align:right;font-weight:900}
.vote-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#E6EAE1}
.vote-bar i{display:block;height:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:900;color:var(--muted)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:11px 13px;min-height:46px;font-weight:700}
.field input:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px rgba(47,143,91,.18)}
.hint{font-size:12px;color:var(--muted)}.hint.bad{color:var(--red)}.hint.ok{color:var(--green)}
.empty{padding:18px;border:2px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted);font-size:13px}
.big{font:600 26px/1.1 var(--f-display)}
.prog{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border-radius:14px;padding:12px}
.prog .spread{display:flex;justify-content:space-between;font-size:13px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--panel2);border:0;text-align:left;width:100%}
.step .sn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;font:700 14px var(--f-display);flex:none;border:2px solid var(--line)}
.step.done .sn{background:var(--green);border-color:var(--green);color:#fff}
.step .grow{flex:1}.step b{display:block}.step small{color:var(--muted);font-size:12px}

/* ---------- penempatan ---------- */
.placebar{align-self:center;width:min(560px,100%);background:var(--panel-solid);border-radius:20px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.placebar .ph{display:flex;gap:10px;align-items:center}
.placebar img{width:56px;height:42px;border-radius:9px;background:#E7F2E0;object-fit:cover;flex:none}
.placebar .grow{flex:1;min-width:0}
.placebar b{font:600 16px var(--f-display);display:block}
.placebar small{display:block;color:var(--muted);font-size:12.5px}
.placebar small.bad{color:var(--red);font-weight:900}
.placebar small.ok{color:var(--green);font-weight:900}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 30%,rgba(255,240,199,.25),rgba(20,34,40,.6));display:grid;place-items:center;padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));overflow:auto}
.mcard{width:min(440px,100%);background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;position:relative}
.mcard h1{font:700 26px/1.1 var(--f-display);margin:0;text-wrap:balance}
.mcard .x{position:absolute;top:14px;right:14px}
.flag{display:flex;flex-direction:column;width:46px;height:30px;border-radius:5px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.flag i{flex:1}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:14px;min-height:50px;font-weight:900;font-size:14.5px}
.gbtn svg{width:20px;height:20px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:900}
.or:before,.or:after{content:"";flex:1;height:1.5px;background:var(--line)}
.profs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.prof{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 10px;display:flex;gap:9px;align-items:flex-start;min-width:0}
.prof .pd{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;font:700 12px var(--f-display)}
.prof b{display:block;font-size:13.5px;font-weight:900}
.prof span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;font-weight:700}
.prof[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold-soft)}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:12px;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}

.donor{align-self:center;display:flex;align-items:center;gap:8px;border:0;background:linear-gradient(135deg,#FFF6D8,#FFE7A3);color:#5A3E00;border-radius:999px;padding:5px 14px 5px 6px;box-shadow:var(--shadow);font-size:12.5px;font-weight:800;max-width:min(560px,100%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donor .dh{width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;color:#D9483B;font-size:13px}
.lbl.donor{background:linear-gradient(135deg,#FFF6D8,#FFE18A);border:2px solid #F2B531;pointer-events:auto;cursor:pointer;font-size:12px}
.lbl.donor:after{border-top-color:#F2B531}
.chatlist{display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg .bub{background:var(--panel2);border-radius:16px 16px 16px 4px;padding:7px 11px;min-width:0}
.msg .bub b{font-size:12.5px;display:block}.msg .bub span{font-size:14px;font-weight:700;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.msg .bub small{font-size:10.5px;color:var(--muted);margin-left:6px;font-weight:700}
.msg.me{align-self:flex-end;flex-direction:row-reverse}.msg.me .bub{background:#DDF2E4;border-radius:16px 16px 4px 16px}
.chatbar{display:flex;gap:8px;position:sticky;bottom:0;background:var(--panel-solid);padding-top:8px}
.chatbar input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;min-height:46px;font-weight:700}
.photobar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));z-index:15;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:rgba(29,43,51,.82);color:#fff;border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);width:min(560px,calc(100% - 24px))}
.photobar label{display:flex;align-items:center;gap:8px;font-size:12.5px;flex:1;min-width:200px}
.photobar input[type=range]{flex:1;accent-color:#F2B531}
.photobar .btn{color:var(--ink)}.photobar .btn.gold{color:var(--gold-ink)}
input[type=range]{accent-color:var(--gold)}
body.photo #hud,body.photo .fabs,body.photo #labels,body.photo #sheet{display:none!important}
.goal{display:flex;flex-direction:column;gap:6px;background:linear-gradient(135deg,#FFF8E1,#FFF0C2);border-radius:14px;padding:12px}
.field textarea{border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:11px 13px;min-height:70px;font-weight:700;resize:vertical}
#toast{position:fixed;left:50%;top:calc(118px + var(--safe-t));transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center;pointer-events:none}
#toast.bad{background:var(--red)}
#toast.good{background:var(--green)}
.float{position:fixed;z-index:31;font:700 20px var(--f-display);color:#F2B531;text-shadow:0 2px 0 #7A4E00,0 0 10px rgba(255,255,255,.8);pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  #toast{animation:tin .2s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}
  .float{animation:up 1.3s ease-out forwards}@keyframes up{to{transform:translateY(-60px);opacity:0}}
  .sheet{animation:sin .22s ease-out}@keyframes sin{from{transform:translateY(30px);opacity:.4}}
}
#boot{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:linear-gradient(180deg,#9FD3E8,#E8F5DF);transition:opacity .5s}
#boot .bc{display:flex;flex-direction:column;align-items:center;gap:14px}
#boot h1{font:700 30px var(--f-display);margin:0;color:var(--ink)}
#boot .ld{width:160px;height:8px;border-radius:4px;background:rgba(255,255,255,.7);overflow:hidden}
#boot .ld i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--red),var(--green));border-radius:4px}
@media (prefers-reduced-motion:no-preference){#boot .ld i{animation:ld 1s ease-in-out infinite alternate}@keyframes ld{to{transform:translateX(370%)}}}
#boot.gone{opacity:0;pointer-events:none}
@media (max-width:520px){
  .pill{padding:4px 10px 4px 5px}.pill .pi{width:22px;height:22px}.pill b{font-size:13px}.pill small{font-size:9px}
  .dock button{min-width:0;padding:6px 2px 5px;font-size:11px}.dock .di{width:36px;height:36px}
  .clock{padding:5px 10px}
  #toast{top:calc(150px + var(--safe-t))}
}

  for (const c of donorClouds){ projV.set(c.mesh.position.x, c.y + 6, c.mesh.position.z).project(camera); const on = projV.z < 1 && Math.abs(projV.x) < 1.05 && projV.y > -1 && projV.y < .85;
    c.label.style.display = on ? '' : 'none'; if (on) c.label.style.transform = `translate(${(projV.x * .5 + .5) * w}px,${(-projV.y * .5 + .5) * h}px) translate(-50%,-100%)`; }
  for (const v of vis.values()) if (v.label){ const [x, z] = centerOf(v.b); const dd = Math.hypot(x - cam.tx, z - cam.tz); list.push([dd, v, x, z]); }
  list.sort((a, b) => a[0] - b[0]);
  list.forEach(([dd, v, x, z], k) => { projV.set(x, v.b.stage === 'bangun' ? 11 : 7.5, z).project(camera);
    const far = cam.dist > 135 && !v.label.classList.contains('vote') && !v.label.classList.contains('mine');
    const on = !far && k < 28 && projV.z < 1 && Math.abs(projV.x) < 1.05 && projV.y > -1 && projV.y < .82 && cam.dist < 230;
    v.label.style.display = on ? '' : 'none'; if (on) v.label.style.transform = `translate(${(projV.x * .5 + .5) * w}px,${(-projV.y * .5 + .5) * h}px) translate(-50%,-100%)`; });
}

/* ---------- loop ---------- */
let last = performance.now(), acc1 = 0, acc5 = 0, frameSkip = 0;
function frame(nowT){
  requestAnimationFrame(frame);
  if (document.hidden) { last = nowT; return; }
  if (LOW && (frameSkip ^= 1)) return;
  const dt = Math.min(.05, (nowT - last) / 1000); last = nowT;
  stepKeys(dt);
  if (fly){ cam.tx += (fly.x - cam.tx) * .1; cam.tz += (fly.z - cam.tz) * .1; cam.dist += (fly.dist - cam.dist) * .1; if (Math.abs(fly.x - cam.tx) + Math.abs(fly.z - cam.tz) + Math.abs(fly.dist - cam.dist) < .6) fly = null; }
  stepMovers(dt); stepSparks(dt); stepDonorClouds(dt);
  for (const j of cranes) j.rotation.y += dt * .25;
  const cl = clouds.userData.list; cl.forEach((c, k) => { c.x += c.sp * dt; if (c.x > 600) c.x = -600; _m4.compose(_v3.set(c.x, c.y, c.z), _q.set(0,0,0,1), _s3.set(c.s, c.s * .8, c.s)); clouds.setMatrixAt(k, _m4); }); clouds.instanceMatrix.needsUpdate = true;
  if (!LOW){ const a = riverGeo.attributes.position, tt = nowT / 1000; for (let k = 0; k < a.count; k++){ a.array[k*3+1] = riverBase[k*3+1] + Math.sin(riverBase[k*3] * .08 + tt * 1.6) * .18 + Math.cos(riverBase[k*3+2] * .5 + tt) * .08; } a.needsUpdate = true; }
  applyCam(); renderer.render(scene, camera); placeLabels();
  acc1 += dt; if (acc1 > 1){ acc1 = 0; applyTime(); for (const v of vis.values()) if (v.building){ applyProgress(v); updateLabel(v); } }
  acc5 += dt; if (acc5 > 4){ acc5 = 0; ensureVisibleDistricts(); for (const v of vis.values()) if (v.label && !v.building) updateLabel(v); }
}

function friendly(err, name){
  const m = String(err?.message || err || '');
  if (err?.code === 'PGRST202') return 'Server Netizenia v2 belum diperbarui (fungsi ' + name + ' belum ada).';
  if (/permission denied|JWT|not authenticated/i.test(m)) return 'Masuk dulu untuk melakukan ini.';
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Koneksi ke server terputus. Coba lagi.';
  return m;
}
async function rpc(name, args){
  if (!sb) throw new Error('Pustaka Supabase gagal dimuat. Periksa koneksi.');
  const { data, error } = await sb.rpc(name, args || {});
  if (error){ const e = new Error(friendly(error, name)); e.code = error.code; throw e; }
  return data;
}

function setOpen(keys){
  const next = new Set(keys); if (next.size === openSet.size && [...next].every(k => openSet.has(k))) return;
  openSet = next; paintTrees(openSet); initMovers(); paintLots();
}
async function loadSnapshot(){
  try {
    const s = await rpc('get_city_snapshot'); S.snap = s; S.preview = false;
    const t = Date.parse(s.now); if (t) clockOffset = t - Date.now();
    setOpen((s.districts || []).filter(d => d.open).map(d => d.key));
    const top = (s.donations || [])[0];
    if (top && S.lastDon !== null && top.id !== S.lastDon && Date.parse(top.at) > now() - 3600000){ toast('💛 Terima kasih ' + top.name + ' atas dukungan ' + rupiah(top.amount) + '!', 'good'); floatText('💛'); }
    S.lastDon = top ? top.id : 0; setDonorClouds(s.donations);
    renderHud(); if (sheetKind) renderSheet(); return true;
  } catch (e) { if (!S.snap) enterPreview(e.message); return false; }
}
async function loadNpcs(){ try { S.npcs = await rpc('get_npcs') || []; initMovers(); } catch (_) {} }
async function loadDistricts(keys){
  keys = [...new Set(keys)].filter(k => openSet.has(k)); if (!keys.length || S.preview) return;
  let list; try { list = await rpc('get_buildings', { p_districts: keys }); } catch (e) { return; }
  const seen = new Set();
  for (const b of list || []){ seen.add(b.id); upsertBuilding(b); }
  for (const [id, b] of [...S.buildings]) if (keys.includes(b.d) && !seen.has(id)){ S.buildings.delete(id); dropVisual(id); }
  keys.forEach(k => S.loaded.set(k, Date.now()));
  rebuildOcc(); paintLots(); renderHud(); if (sheetKind && sheetKind !== 'bangun') renderSheet();
}
function upsertBuilding(b){
  S.buildings.set(b.id, b); const v = vis.get(b.id);
  if (!v || v.key !== visualKey(b)) makeVisual(b); else { v.b = b; updateLabel(v); }
}
function rebuildOcc(){ S.occ = new Map(); for (const b of S.buildings.values()) for (let a = 0; a < b.w; a++) for (let c = 0; c < b.h; c++) S.occ.set((b.j + c) * N + b.i + a, b.id); }
function paintLots(){
  const mineSet = new Set(); if (S.me) for (const b of S.buildings.values()) if (b.owner_id === S.me.id) for (let a = 0; a < b.w; a++) for (let c = 0; c < b.h; c++) mineSet.add((b.j + c) * N + b.i + a);
  lotList.forEach(([i, j], k) => { const d = districtOf(i, j), key = j * N + i; let col;
    if (!openSet.has(d)) col = LOTC.forest; else if (place && !S.occ.has(key)) col = LOTC.free; else if (mineSet.has(key)) col = LOTC.mine; else col = LOTC.lawn[(i * 7 + j * 3) % 3];
    lotMesh.setColorAt(k, col); });
  lotMesh.instanceColor.needsUpdate = true;
}
function visibleDistricts(){
  const r = cam.dist * .95 + 25, out = [];
  for (const k of DISTRICTS){ if (!openSet.has(k)) continue; const [i0, j0, i1, j1] = DIST_RECT[k]; const x0 = wx(i0), z0 = wx(j0), x1 = wx(i1), z1 = wx(j1);
    const dx = Math.max(x0 - cam.tx, 0, cam.tx - x1), dz = Math.max(z0 - cam.tz, 0, cam.tz - z1); if (Math.hypot(dx, dz) <= r) out.push(k); }
  return out;
}
let loadingD = false;
async function ensureVisibleDistricts(){
  if (S.preview || loadingD || !S.snap) return; const need = visibleDistricts().filter(k => !S.loaded.has(k)); if (!need.length) return;
  loadingD = true; try { await loadDistricts(need); } finally { loadingD = false; }
}
let pollN = 0;
async function poll(){
  if (document.hidden || S.preview) return; pollN++;
  await loadSnapshot();
  if (!S.session ? pollN % 2 === 0 : !S.live || pollN % 3 === 0) await loadDistricts([...S.loaded.keys()]);
  if (S.session) loadMe(true);
}

/* ---------- realtime: hanya pemain login, hanya tabel yang perlu ---------- */
let rq = { ds: new Set(), snap: false, t: null };
function queueRefresh(d, snap){
  if (d) rq.ds.add(d); else for (const k of S.loaded.keys()) rq.ds.add(k); if (snap) rq.snap = true;
  clearTimeout(rq.t); rq.t = setTimeout(async () => { const ds = [...rq.ds].filter(k => S.loaded.has(k)), sn = rq.snap; rq = { ds: new Set(), snap: false, t: null }; if (sn) await loadSnapshot(); if (ds.length) await loadDistricts(ds); }, 1200);
}
function startLive(){
  if (!sb || S.live || S.preview) return;
  S.live = sb.channel('nz-kota')
    .on('postgres_changes', { event: '*', schema: 'nz', table: 'buildings' }, p => queueRefresh(p.new?.district || p.old?.district || null, p.eventType !== 'UPDATE'))
    .on('postgres_changes', { event: '*', schema: 'nz', table: 'proposals' }, p => { const bid = p.new?.building_id || p.old?.building_id; queueRefresh(S.buildings.get(bid)?.d || null, true); })
    .on('postgres_changes', { event: 'INSERT', schema: 'nz', table: 'chat_messages' }, p => onChatRow(p.new))
    .on('postgres_changes', { event: 'DELETE', schema: 'nz', table: 'chat_messages' }, p => { if (S.chat && p.old?.id){ S.chat = S.chat.filter(m => m.id !== p.old.id); if (sheetKind === 'chat') renderSheet(); } })
    .subscribe();
}
async function loadChat(){ try { S.chat = await rpc('get_chat', { p_limit: 50 }) || []; } catch (_) {} if (sheetKind === 'chat') renderSheet(true); }
function onChatRow(r){
  if (!r || !S.chat) return; if (S.chat.some(m => m.id === r.id)) return;
  S.chat.push({ id: r.id, name: r.name, prof: r.profession, text: r.text, at: r.created_at }); if (S.chat.length > 80) S.chat.shift();
  if (sheetKind === 'chat') renderSheet(true); else if (!S.me || r.name !== S.me.name){ S.unread++; renderDock(); }
}
function stopLive(){ if (S.live){ try { sb.removeChannel(S.live); } catch (_) {} S.live = null; } }

async function loadMe(quiet){
  if (!S.session || S.preview){ S.me = null; return; }
  try {
    S.me = await rpc('get_my_state');
    if (S.me && S.me.logged_in && !S.me.registered && modalKind !== 'register') openModal('register');
    if (registered() && (modalKind === 'login' || modalKind === 'register')) closeModal();
  } catch (e) { if (!quiet) toast(e.message, 'bad'); }
  renderHud(); paintLots(); if (sheetKind && !quiet) renderSheet();
}
function initAuth(){
  if (!sb) return;
  sb.auth.onAuthStateChange((ev, session) => { S.session = session; setTimeout(() => onSession(ev), 0); });
}
async function onSession(ev){
  if (/[?&]code=/.test(location.search)) history.replaceState(null, '', location.pathname);
  if (S.session){ await loadMe(); startLive(); loadChat(); for (const v of vis.values()) updateLabel(v); }
  else { S.me = null; stopLive(); }
  renderHud(); paintLots(); if (sheetKind) renderSheet();
}
function mapAuth(err){
  const m = String(err?.message || err);
  if (/invalid login|invalid credentials/i.test(m)) return 'Username atau kata sandi salah.';
  if (/already registered|already been registered|exists/i.test(m)) return 'Username sudah dipakai. Pilih yang lain atau masuk.';
  if (/email.*invalid|invalid.*email/i.test(m)) return 'Server menolak akun username (format email internal). Kabari presiden.';
  if (/rate limit|too many/i.test(m)) return 'Terlalu banyak percobaan. Tunggu sebentar lalu coba lagi.';
  if (/password/i.test(m)) return 'Kata sandi terlalu lemah. Pakai minimal 8 karakter.';
  if (/signups not allowed|signup.*disabled/i.test(m)) return 'Pendaftaran sedang ditutup di server.';
  return m;
}
// Tombol Google hanya tampil bila provider Google aktif di Supabase (pengaturan publik GoTrue).
let googleOn = null;
async function loadAuthSettings(){
  try { const r = await fetch(CFG.url + '/auth/v1/settings', { headers: { apikey: CFG.key } }); const d = await r.json(); googleOn = !!(d && d.external && d.external.google); }
  catch (_) { googleOn = null; }
  if (modalKind === 'login') renderModal();
}
async function loginGoogle(){
  if (!sb) return toast('Pustaka Supabase gagal dimuat.', 'bad');
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
  if (error) toast(mapAuth(error), 'bad');
}
async function loginUser(mode, u, pw){
  u = String(u || '').trim().toLowerCase();
  if (!/^[a-z0-9_.]{3,20}$/.test(u)) throw new Error('Username 3–20 karakter: huruf kecil, angka, titik, atau garis bawah.');
  if (String(pw || '').length < 8) throw new Error('Kata sandi minimal 8 karakter.');
  const email = u + '@' + CFG.mailDomain;
  if (mode === 'daftar'){
    let free = true; try { free = await rpc('username_available', { p_username: u }); } catch (_) {}
    if (!free) throw new Error('Username sudah dipakai. Pilih yang lain atau masuk.');
    const { data, error } = await sb.auth.signUp({ email, password: pw });
    if (error) throw new Error(mapAuth(error));
    if (!data.session) throw new Error('Akun dibuat, tapi server meminta konfirmasi email. Presiden perlu mematikan "Confirm email".');
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw new Error(mapAuth(error));
  }
}
async function logout(){ try { await sb.auth.signOut(); } catch (_) {} S.me = null; closeSheet(); toast('Kamu keluar. Sampai jumpa!'); }

/* ---------- aksi pemain: semua lewat RPC, server yang memutuskan ---------- */
async function act(name, args, opts){
  opts = opts || {};
  if (S.preview) return toast('Mode pratinjau: aksi dimatikan sampai server v2 aktif.', 'bad');
  if (!S.session) return openModal('login');
  if (!registered()) return openModal('register');
  const before = Number(S.me.coins) || 0;
  try {
    const r = await rpc(name, args);
    if (r && r.msg) toast(r.msg, 'good');
    await loadMe(true);
    const diff = (Number(S.me?.coins) || 0) - before; if (diff) floatText((diff > 0 ? '+' : '') + fmt(diff) + ' NC', opts.x, opts.y);
    if (opts.refresh !== false){ await loadDistricts(opts.districts || [...S.loaded.keys()]); loadSnapshot(); }
    if (sheetKind) renderSheet();
    return r || true;
  } catch (e) { toast(e.message, 'bad'); return null; }
}

let place = null;
function startPlace(type, at){

  const err = ruleErr(type); if (err) return toast(err, 'bad');
  const ct = catOf(type); closeSheet(); place = { type, w: ct.w, h: ct.h, rot: false, i: null, j: null, err: null };
  $('#placebar').hidden = false; paintLots(); renderHud();
  if (at) setPlaceAnchor(at[0], at[1]); else { renderPlacebar(); if (cam.dist > 120) flyTo(cam.tx, cam.tz, 110); }
}
function fitsLocal(i, j, w, h){
  if (i < 1 || j < 1 || i + w - 1 > N - 2 || j + h - 1 > N - 2) return 'Di luar peta.';
  if (blk(i) !== blk(i + w - 1) || blk(j) !== blk(j + h - 1)) return 'Harus muat dalam satu blok, tidak boleh melewati jalan.';
  for (let a = 0; a < w; a++) for (let c = 0; c < h; c++){ if (!isLot(i + a, j + c)) return 'Tidak bisa di atas jalan.'; if (S.occ.has((j + c) * N + i + a)) return 'Kavling sudah terisi.'; }
  if (!openSet.has(districtOf(i, j))) return DIST_NAME[districtOf(i, j)] + ' belum dibuka.';
  return null;
}
function setPlaceAnchor(i, j){
  if (!place) return; place.i = i - Math.floor((place.w - 1) / 2); place.j = j - Math.floor((place.h - 1) / 2);
  place.err = fitsLocal(place.i, place.j, place.w, place.h) || ruleErr(place.type);
  const cx = wx(place.i) + (place.w - 1) * T / 2, cz = wx(place.j) + (place.h - 1) * T / 2;
  placeGhost.visible = true; placeGhost.material.color.copy(lin(place.err ? '#D9483B' : '#2F8F5B')); placeGhost.scale.set(place.w * T - 1, 5, place.h * T - 1); placeGhost.position.set(cx, 2.8, cz);
  if (placePreview){ scene.remove(placePreview); placePreview = null; }
  if (!place.err){ const g = modelGeo(place.type, S.me?.color || '#D9483B', WALLS[0]); placePreview = new THREE.Group(); const inner = new THREE.Group(); inner.add(new THREE.Mesh(g.body, PREVIEW_MAT)); if (place.rot) inner.rotation.y = Math.PI / 2; placePreview.add(inner); placePreview.position.set(cx, .37, cz); scene.add(placePreview); }
  renderPlacebar();
}
function renderPlacebar(){
  if (!place) return; const ct = catOf(place.type), pr = priceOf(place.type);
  const status = place.i === null ? '<small>Ketuk kavling hijau di peta.</small>' : place.err ? `<small class="bad">${esc(place.err)}</small>` : '<small class="ok">Kavling cocok. Tekan ' + (ct.kind === 'umum' ? 'Ajukan' : 'Bangun') + '.</small>';
  $('#placebar').innerHTML = `<div class="ph"><img src="${thumbs[place.type] || ''}" alt=""><div class="grow"><b>${esc(ct.n)}</b><small>${ct.kind === 'umum' ? 'Usulan · biaya kas ' + nc(pr) + ' bila lolos' : pr ? nc(pr) + ' termasuk tanah' : 'Gratis: rumah pertamamu'} · ${place.w}×${place.h} kavling</small>${status}</div></div>
    <div class="row">${ct.w !== ct.h ? '<button class="btn sm" data-act="rotate">Putar</button>' : ''}<button class="btn sm" data-act="cancel-place">Batal</button><button class="btn sm gold" data-act="confirm-place" ${place.i === null || place.err ? 'disabled' : ''}>${ct.kind === 'umum' ? 'Ajukan usulan' : 'Bangun'}</button></div>`;
}
function cancelPlace(){ place = null; placeGhost.visible = false; if (placePreview){ scene.remove(placePreview); placePreview = null; } $('#placebar').hidden = true; selMesh.visible = false; paintLots(); renderHud(); }
async function confirmPlace(btn){
  if (!place || place.err || place.i === null) return; const ct = catOf(place.type), p = { ...place };
  btn?.classList.add('busy');
  const r = await act(ct.kind === 'umum' ? 'propose_public' : 'build_private', { p_type: p.type, p_i: p.i, p_j: p.j, p_rotated: p.rot }, { districts: [districtOf(p.i, p.j)] });
  btn?.classList.remove('busy');
  if (r){ cancelPlace(); const id = r.id; flyTo(wx(p.i) + (p.w - 1) * T / 2, wx(p.j) + (p.h - 1) * T / 2, 60); if (id && S.buildings.get(id)) setTimeout(() => openInfo(id), 500); }
}

/* ---------- semua klik ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('button, [data-act]'); if (!el || el.disabled) return;
  if (el.id === 'meChip'){ if (registered()) openSheet('profil'); else if (S.session) openModal('register'); else openModal('login'); return; }
  if (el.dataset.dock){ const k = el.dataset.dock; if (dockSel === k && sheetKind){ closeSheet(); return; } if (place) cancelPlace(); sheetTab = null; openSheet(k); return; }
  if (el.dataset.open){ openSheet(el.dataset.open); return; }
  if (el.dataset.tab){ sheetTab = el.dataset.tab; renderSheet(); return; }
  if (el.dataset.place){ if (el.getAttribute('aria-disabled') === 'true'){ toast(ruleErr(el.dataset.place) || 'Belum bisa.', 'bad'); return; } startPlace(el.dataset.place, el.dataset.at ? el.dataset.at.split(',').map(Number) : null); return; }
  if (el.dataset.wtab){ sheetArg = { ...(sheetArg || {}), f: el.dataset.wtab, list: null, err: null }; renderSheet(); return; }
  if (el.dataset.lmode){ loginMode = el.dataset.lmode; renderModal(); return; }
  if (el.dataset.dp){ draft.prof = el.dataset.dp; draft.name = $('#rn')?.value || draft.name; renderModal(); return; }
  if (el.dataset.dc){ draft.color = el.dataset.dc; draft.name = $('#rn')?.value || draft.name; renderModal(); return; }
  const a = el.dataset.act; if (!a) return; const id = el.dataset.id != null ? Number(el.dataset.id) : null;
  const busy = async fn => { el.classList.add('busy'); try { await fn(); } finally { el.classList.remove('busy'); } };
  const rect = el.getBoundingClientRect(), pos = { x: rect.left + rect.width / 2 - 30, y: rect.top - 10 };
  switch (a){
    case 'close': closeSheet(); break;
    case 'close-modal': closeModal(); break;
    case 'login': openModal('login'); break;
    case 'register': if (modalKind === 'register'){ const name = $('#rn').value.trim(); if (name.length < 2){ $('#rhint').textContent = 'Nama minimal 2 huruf.'; $('#rhint').className = 'hint bad'; break; }
        await busy(async () => { try { S.me = await rpc('register_profile', { p_name: name, p_profession: draft.prof, p_color: draft.color }); closeModal(); renderHud(); paintLots(); startLive(); openModal('welcome'); } catch (err) { $('#rhint').textContent = err.message; $('#rhint').className = 'hint bad'; } }); }
      else openModal('register'); break;
    case 'start': closeModal(); sheetTab = 'rumah'; openSheet('bangun'); break;
    case 'google': loginGoogle(); break;
    case 'logout': closeModal(); await logout(); break;
    case 'banner-off': store.set('nz_banner_off', true); renderHud(); break;
    case 'free-house': sheetTab = 'rumah'; openSheet('bangun'); break;
    case 'open-voting': openSheet('voting'); break;
    case 'profil': if (registered()) openSheet('profil'); else openModal('login'); break;
    case 'goto': { const b = S.buildings.get(id); if (b){ const [x, z] = centerOf(b); flyTo(x, z, 55); openInfo(id); } else if (id) toast('Bangunan ada di distrik yang belum dimuat.'); break; }
    case 'goto-b': { const b = S.buildings.get(id); if (b){ const [x, z] = centerOf(b); flyTo(x, z, 60); openInfo(id); } break; }
    case 'goto-d': { const [i0, j0, i1, j1] = DIST_RECT[el.dataset.d]; flyTo(wx((i0 + i1) / 2), wx((j0 + j1) / 2), 150); closeSheet(); break; }
    case 'home': { const hid = S.me?.home_building_id; if (hid && S.buildings.get(hid)){ const [x, z] = centerOf(S.buildings.get(hid)); flyTo(x, z, 50); } else toast(registered() ? 'Kamu belum punya rumah. Ambil rumah gratis di menu Bangun.' : 'Masuk dulu untuk punya rumah.'); break; }
    case 'center': flyTo(wx(20), wx(21), MOBILE ? 175 : 150); break;
    case 'rotate': if (place){ if (catOf(place.type).w === catOf(place.type).h) break; place.rot = !place.rot; [place.w, place.h] = [place.h, place.w]; if (place.i !== null) setPlaceAnchor(place.i + Math.floor((place.w - 1) / 2), place.j + Math.floor((place.h - 1) / 2)); else renderPlacebar(); } else { cam.theta += Math.PI / 2; } break;
    case 'cancel-place': cancelPlace(); break;
    case 'confirm-place': confirmPlace(el); break;
    case 'vote': await busy(() => act('vote_proposal', { p_id: id, p_vote: Number(el.dataset.v) }, { ...pos })); break;
    case 'dvote': await busy(() => act('vote_district', { p_id: id, p_vote: Number(el.dataset.v) }, { refresh: false })); loadSnapshot(); break;
    case 'propose-dist': await busy(() => act('propose_district', { p_district: el.dataset.d }, { refresh: false })); await loadSnapshot(); openSheet('voting'); break;
    case 'help': await busy(() => act('help_build', { p_building_id: id }, { ...pos })); break;
    case 'demolish': if (el.dataset.sure){ await busy(() => act('demolish_building', { p_id: id })); closeSheet(); } else { el.dataset.sure = '1'; el.textContent = 'Yakin? Ketuk lagi untuk bongkar'; } break;
    case 'chprof': if (el.dataset.p === S.me?.profession) break; if (el.dataset.sure){ await busy(() => act('change_profession', { p_profession: el.dataset.p }, { refresh: false })); } else { el.dataset.sure = '1'; el.querySelector('b').textContent = 'Ketuk lagi: ganti (100 NC)'; } break;
    case 'color': await busy(() => act('set_color', { p_color: el.dataset.c }, { refresh: false })); break;
    case 'pres-approve': await busy(() => act('pres_approve', { p_id: id })); break;
    case 'pres-veto': if (el.dataset.sure){ await busy(() => act('pres_veto', { p_id: id })); closeSheet(); } else { el.dataset.sure = '1'; el.textContent = 'Yakin veto? Ketuk lagi'; } break;
    case 'pres-dist': await busy(() => act('pres_open_district', { p_district: el.dataset.d }, { refresh: false })); await loadSnapshot(); break;
    case 'open-kerja': openSheet('kerja'); break;
    case 'open-donatur': openSheet('donatur'); break;
    case 'open-admin': openSheet('admin', {}); break;
    case 'npc-open': { const n = (S.npcs || []).find(x => x[0] === Number(el.dataset.n)); const row = (sheetArg?.list || []).find(x => x.kind === 'npc' && x.id === Number(el.dataset.n)); openSheet('npc', n || [Number(el.dataset.n), row?.name || 'Warga', row?.prof || 'Warga', row?.color, null, row?.sick, null]); break; }
    case 'claim-open': if (!registered()) { openModal(S.session ? 'register' : 'login'); break; } modalArg = Number(el.dataset.n); openModal('claim'); break;
    case 'optout-open': if (!S.session) { openModal('login'); break; } modalArg = Number(el.dataset.n); openModal('optout'); break;
    case 'claim-send': await busy(async () => { try { const r = await rpc('request_claim_v2', { p_npc_id: modalArg, p_ig: $('#cig').value.trim() || null, p_note: $('#cnote').value.trim() || null }); closeModal(); toast(r.msg, 'good'); loadMe(true); } catch (err) { $('#chint').textContent = err.message; $('#chint').className = 'hint bad'; } }); break;
    case 'optout-send': await busy(async () => { try { const r = await rpc('request_opt_out', { p_npc_id: modalArg, p_reason: $('#cnote').value.trim() || null }); closeModal(); toast(r.msg, 'good'); } catch (err) { $('#chint').textContent = err.message; $('#chint').className = 'hint bad'; } }); break;
    case 'chat-del': await busy(() => act('admin_delete_chat', { p_id: id }, { refresh: false })); if (S.chat) S.chat = S.chat.filter(m => m.id !== id); loadSnapshot(); break;
    case 'adm-claim': await busy(() => act('admin_review_claim', { p_request_id: id, p_approve: el.dataset.v === '1' }, { refresh: false })); loadQueue(); loadNpcs(); break;
    case 'adm-optout': await busy(() => act('admin_review_optout', { p_id: id, p_approve: el.dataset.v === '1' }, { refresh: false })); loadQueue(); loadNpcs(); break;
    case 'adm-tax': await busy(() => act('pres_set_tax', { p_pct: Number($('#atax').value) }, { refresh: false })); loadSnapshot(); break;
    case 'adm-ann': { const t = $('#aann').value.trim(); if (t.length < 3){ toast('Pengumuman terlalu pendek.', 'bad'); break; } await busy(() => act('pres_announce', { p_text: t }, { refresh: false })); $('#aann').value = ''; loadSnapshot(); break; }
    case 'adm-don-add': { const nm = $('#dnm').value.trim(), am = Number($('#damt').value); if (!nm || !(am >= 0)){ toast('Isi nama dan nominal.', 'bad'); break; } const r = await act('pres_add_donation', { p_name: nm, p_amount: Math.round(am), p_message: $('#dmsg').value.trim() || null }, { refresh: false }); if (r){ $('#dnm').value = $('#damt').value = $('#dmsg').value = ''; await loadSnapshot(); } break; }
    case 'adm-don-del': if (el.dataset.sure){ await busy(() => act('admin_delete_donation', { p_id: id }, { refresh: false })); loadSnapshot(); } else { el.dataset.sure = '1'; el.textContent = 'Yakin?'; } break;
    case 'adm-goal': await busy(() => act('admin_set_donation_goal', { p_amount: Math.max(0, Math.round(Number($('#dgoal').value) || 0)) }, { refresh: false })); loadSnapshot(); break;
    case 'adm-saweria': await busy(() => act('pres_set_saweria', { p_url: $('#dsaw').value.trim() }, { refresh: false })); loadSnapshot(); break;
    case 'adm-tick': await busy(async () => { try { const r = await rpc('admin_run_tick'); toast('Dihitung: ' + (r.usulan_ditutup || 0) + ' usulan ditutup, ' + (r.selesai_dibangun || 0) + ' bangunan selesai.', 'good'); } catch (err) { toast(err.message, 'bad'); } }); await loadSnapshot(); await loadDistricts([...S.loaded.keys()]); break;
    case 'photo': photoOn(); break;
    case 'photo-save': photoSave(); break;
    case 'photo-exit': photoOff(); break;
    case 'open-warga': openSheet('warga', { f: el.dataset.f || 'semua', q: '' }); break;
    case 'shift': await busy(() => act('do_shift', {}, { ...pos, refresh: false })); break;
    case 'odd': await busy(() => act('odd_job', {}, { ...pos, refresh: false })); break;
    case 'quit': if (el.dataset.sure){ await busy(() => act('quit_job', {})); } else { el.dataset.sure = '1'; el.textContent = 'Yakin berhenti? Ketuk lagi'; } break;
    case 'apply': await busy(() => act('apply_job', { p_building_id: id }, { ...pos })); break;
    case 'pact': await busy(() => act('prof_action', { p_kind: el.dataset.k }, { ...pos, refresh: false })); loadSnapshot(); break;
    case 'rancang': await busy(() => act('prof_action', { p_kind: 'rancang', p_target_id: id }, { ...pos, refresh: false })); await loadSnapshot(); renderSheet(); break;
    case 'pact-t': await busy(() => act('prof_action', { p_kind: el.dataset.k, p_target: el.dataset.u || null, p_target_id: el.dataset.n ? Number(el.dataset.n) : null }, { ...pos, refresh: false })); if (sheetKind === 'warga') loadCitizens(); break;
    case 'report': if (el.dataset.sure){ await busy(() => act('report_citizen', { p_target: el.dataset.u }, { refresh: false })); if (sheetKind === 'warga') loadCitizens(); } else { el.dataset.sure = '1'; el.textContent = 'Yakin lapor? Ketuk lagi'; } break;
    case 'treat': await busy(() => act('seek_treatment', {}, { ...pos, refresh: false })); break;
    case 'wage': await busy(() => act('set_wage', { p_building_id: id, p_wage: Number(el.dataset.w) })); break;
    case 'jobopen': await busy(() => act('set_job_open', { p_building_id: id, p_open: el.dataset.v === '1' })); break;
    case 'minister': await busy(() => act('pres_set_minister', { p_user: el.dataset.u, p_on: el.dataset.on === '1' }, { refresh: false })); if (sheetKind === 'warga') loadCitizens(); break;
    case 'release': await busy(() => act('pres_release', { p_user: el.dataset.u }, { refresh: false })); if (sheetKind === 'warga') loadCitizens(); break;
    default: if (a.startsWith('goto:')){ const b = S.buildings.get(Number(a.slice(5))); if (b){ const [x, z] = centerOf(b); flyTo(x, z, 55); openInfo(b.id); } }
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'chatForm'){ e.preventDefault(); const inp = $('#cmsg'), t = inp.value.trim(); if (!t) return; const btn = e.target.querySelector('button'); btn.classList.add('busy');
    try { await rpc('send_chat_message', { p_text: t }); inp.value = ''; setTimeout(loadChat, 700); } catch (err) { toast(err.message, 'bad'); } finally { btn.classList.remove('busy'); } return; }
  if (e.target.id !== 'loginForm') return; e.preventDefault(); const btn = e.target.querySelector('button[type=submit]'), hint = $('#lhint');
  btn.classList.add('busy'); hint.className = 'hint'; hint.textContent = loginMode === 'daftar' ? 'Membuat akun…' : 'Masuk…';
  try { await loginUser(loginMode, $('#lu').value, $('#lp').value); hint.textContent = 'Berhasil!'; hint.className = 'hint ok'; }
  catch (err) { hint.textContent = err.message; hint.className = 'hint bad'; }
  finally { btn.classList.remove('busy'); }
});
document.addEventListener('input', e => { if (e.target.id === 'atax') $('#ataxv').textContent = e.target.value + '%'; if (e.target.id === 'phour'){ photoHour = Number(e.target.value); applyTime(true); $('#phourv').textContent = wibClock(); } if (e.target.id === 'wq' && sheetKind === 'warga'){ sheetArg.q = e.target.value; clearTimeout(citT); citT = setTimeout(loadCitizens, 350); } if (e.target.id === 'rn') draft.name = e.target.value; if (e.target.id === 'lu' && loginMode === 'daftar'){ const v = e.target.value.trim().toLowerCase(); const ok = /^[a-z0-9_.]{3,20}$/.test(v); $('#lhint').textContent = v ? (ok ? 'Format username oke.' : 'Huruf kecil, angka, titik, atau garis bawah (3–20).') : ''; $('#lhint').className = 'hint ' + (v ? (ok ? 'ok' : 'bad') : ''); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.snap && !S.preview) poll(); });

/* =====================================================================
   MULAI
   ===================================================================== */
(async function boot(){
  resize(); applyTime(true); paintTrees(openSet); initMovers(); applyCam(); renderHud();
  requestAnimationFrame(frame);
  if (!sb) enterPreview('Pustaka Supabase gagal dimuat.');
  else {
    initAuth(); loadAuthSettings();
    const ok = await loadSnapshot();
    if (ok){ await Promise.all([loadNpcs(), loadDistricts(['pusat'])]); ensureVisibleDistricts(); }
  }
  rotateTicker();
  const bt = $('#boot'); bt.classList.add('gone'); setTimeout(() => bt.remove(), 600);
  setInterval(poll, 60000); setInterval(rotateTicker, 5000); setInterval(() => { if (document.hidden) return; renderNext(); renderDock(); if (sheetKind === 'kerja') renderSheet(); }, 30000);
})();
</script>
